.rnk-2{border:2.5px solid #C0C0C0!important;outline-width:2.5px;outline-color:#C0C0C0;animation:silverShine 2.2s ease-in-out infinite}

@keyframes goldGlow{0%,100%{outline-color:#F59E0B;outline-offset:2px}50%{outline-color:#FEF3C7;outline-offset:5px}}

// helpers
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
const lsSet = (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const getTeamKey = (group = '') => {
  const m = group.trim().match(/^([A-D])/i);
  return m ? m[1].toUpperCase() : null;
};

const fmtTime = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bangkok' });
  } catch {
    const d = new Date(new Date(iso).getTime() + 7*3600*1000); // UTC+7 fallback
    return d.toISOString().substring(11, 16);
  }
};
const fmtDate = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('th-TH', { day:'numeric', month:'short', timeZone:'Asia/Bangkok' });
  } catch {
    const d = new Date(iso);
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  }
};

// ── Rank helper ───────────────────────────────────────────────
const rankClass = pos =>
  pos === 0 ? 'rnk-1' : pos === 1 ? 'rnk-2' : pos === 2 ? 'rnk-3' : pos <= 9 ? 'rnk-4' : '';

// ── Auth helpers ─────────────────────────────────────────────
const getSession = () => {
  const s = lsGet('tvohh_session', null);
  if (!s) return null;
  // normalize group → teamKey
  const group = typeof s.group === 'string' ? s.group : (s.group?.Value || 'A : ใส่ใจลูกค้า');
  return { ...s, group };
};

// ── Supabase API ──────────────────────────────────────────────
const fetchMessages = async (teamKey) => {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - RETENTION_DAYS);
  const { data, error } = await supabase
    .from('chat_messages')
    .select('id,employee_id,display_name,message,created_at')
    .eq('team', teamKey)
    .gte('created_at', cutoff.toISOString())
    .order('created_at', { ascending: true })
    .limit(200);
  if (error) throw new Error(error.message);
  return data || [];
};

// ดึงข้อมูล profile + rank ของสมาชิกในทีม
const fetchTeamUserData = async (teamLabel) => {
  const [{ data: users }, { data: logs }] = await Promise.all([
    supabase.from('user_profiles')
      .select('employee_id,display_name,photo,profile_icon')
      .eq('group_name', teamLabel),
    supabase.from('exercise_logs')
      .select('employee_id,user_name,calories')
      .eq('group_name', teamLabel),
  ]);
  // รวม calories ต่อ user
  const calMap = {};
  (logs || []).forEach(l => {
    const key = l.employee_id || l.user_name;
    calMap[key] = (calMap[key] || 0) + (Number(l.calories) || 0);
  });
  // sort หาอันดับ
  const sorted = (users || [])
    .map(u => ({ ...u, total: calMap[u.employee_id] || calMap[u.display_name] || 0 }))
    .sort((a, b) => b.total - a.total);

  const avatarMap = {}, iconMap = {}, rankMap = {};
  sorted.forEach((u, i) => {
    if (u.photo)         avatarMap[u.display_name] = u.photo;
    if (u.profile_icon)  iconMap[u.display_name]   = u.profile_icon;
    rankMap[u.display_name] = i;
  });
  return { avatarMap, iconMap, rankMap };
};

const sbEditMessage = async (id, empId, newText) => {
  const { error } = await supabase.from('chat_messages')
    .update({ message: newText.trim(), edited: true })
    .eq('id', id).eq('employee_id', empId);
  if (error) throw new Error(error.message);
};

const sbDeleteMessage = async (id, empId) => {
  const { error } = await supabase.from('chat_messages')
    .delete().eq('id', id).eq('employee_id', empId);
  if (error) throw new Error(error.message);
};

const sendMessage = async (teamKey, empId, displayName, message) => {
  const { data, error } = await supabase.from('chat_messages').insert({
    team: teamKey,
    employee_id: empId,
    display_name: displayName,
    message: message.trim(),
  }).select().single();
  if (error) throw new Error(error.message);
  return data;
};

// ── Notification helpers ──────────────────────────────────────
// iOS Safari ไม่รองรับ Notification API เลย — ต้องเช็คก่อนเสมอ
const NOTIF_SUPPORTED = (typeof window !== 'undefined') && ('Notification' in window);

const requestNotifPermission = () => new Promise(resolve => {
  if (!NOTIF_SUPPORTED) return resolve(false);
  if (Notification.permission === 'granted') return resolve(true);
  if (Notification.permission === 'denied') return resolve(false);
  try {
    // บาง browser เก่าคืน callback ไม่ใช่ Promise
    const result = Notification.requestPermission(perm => resolve(perm === 'granted'));
    if (result && typeof result.then === 'function') {
      result.then(perm => resolve(perm === 'granted')).catch(() => resolve(false));
    }
  } catch { resolve(false); }
});

const showNotif = (title, body) => {
  if (!NOTIF_SUPPORTED || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: 'logo.png' }); } catch {}
};

function Avatar({ name, color, size = 36, photo, icon, rankPos }) {
  const rc = (rankPos !== undefined && rankPos !== null) ? rankClass(rankPos) : '';
  const inner = photo
    ? <img src={photo} alt="" className={rc} style={{ width:size, height:size, borderRadius:'50%', objectFit:'cover', display:'block' }} />

      </div>;
  return (
    <div style={{ position:'relative', flexShrink:0, width:size, height:size }}>

}

function MessageBubble({ msg, isOwn, teamColor, photo, icon, rankPos, menuOpen, onMenuToggle, onEdit, onDelete, isEditing, editText, onEditChange, onEditSave, onEditCancel }) {
  const timeStr = fmtTime(msg.created_at);
  const editRef = useRef(null);

  useEffect(() => {
    if (isEditing) { editRef.current?.focus(); editRef.current?.select(); }
  }, [isEditing]);

  return (
    <div style={{
      display:'flex', flexDirection: isOwn ? 'row-reverse' : 'row',

    }}>
      {!isOwn && <Avatar name={msg.display_name} color={teamColor} size={36} photo={photo} icon={icon} rankPos={rankPos} />}
      <div style={{ maxWidth:'72%', display:'flex', flexDirection:'column', alignItems: isOwn ? 'flex-end' : 'flex-start' }}>
        {!isOwn && (
          <div style={{ fontSize:'11px', color:'#6B7280', marginBottom:'2px', paddingLeft:'4px', display:'flex', alignItems:'center', gap:'3px' }}>
            {icon && <span>{icon}</span>}
            <span>{msg.display_name}</span>
          </div>
        )}

        {/* ── Inline edit mode ── */}
        {isEditing ? (
          <div style={{ display:'flex', flexDirection:'column', gap:'6px', width:'240px' }}>
            <textarea
              ref={editRef}
              value={editText}
              onChange={e => onEditChange(e.target.value.slice(0, MAX_LEN))}
              onKeyDown={e => { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();onEditSave();} if(e.key==='Escape') onEditCancel(); }}
              style={{
                resize:'none', border:`1.5px solid ${teamColor}`, borderRadius:'12px',
                padding:'8px 12px', fontSize:'14px', fontFamily:'Sarabun,sans-serif',
                lineHeight:1.5, outline:'none', minHeight:'60px',
              }}
            />
            <div style={{ display:'flex', gap:'6px', justifyContent:'flex-end' }}>
              <button onClick={onEditCancel} style={{ fontSize:'12px', padding:'4px 12px', borderRadius:'8px', border:'1px solid #D1D5DB', background:'#fff', cursor:'pointer' }}>ยกเลิก</button>
              <button onClick={onEditSave} style={{ fontSize:'12px', padding:'4px 12px', borderRadius:'8px', border:'none', background:teamColor, color:'#fff', cursor:'pointer', fontWeight:600 }}>บันทึก</button>
            </div>
          </div>
        ) : (
          <div style={{ position:'relative' }}>
            <div
              onClick={e => { if (!isOwn) return; e.stopPropagation(); onMenuToggle(msg.id); }}
              style={{
                background: isOwn ? teamColor : '#fff',
                color: isOwn ? '#fff' : '#1F2937',
                padding:'10px 14px', borderRadius: isOwn ? '18px 18px 4px 18px' : '18px 18px 18px 4px',

                position:'absolute', right:0, bottom:'calc(100% + 4px)',
                background:'#fff', borderRadius:'10px', boxShadow:'0 4px 16px rgba(0,0,0,0.15)',

                <button onClick={e => { e.stopPropagation(); onEdit(msg); onMenuToggle(null); }} style={{
                  display:'flex', alignItems:'center', gap:'8px', width:'100%',

function ChatRoom({ session, teamKey, onBack }) {
  const meta = TEAM_META[teamKey];
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const [error, setError] = useState('');
  const [notifOn, setNotifOn] = useState(() => lsGet('tvohh_chat_notif', true));
  const [unread, setUnread] = useState(0);
  const [menuMsgId, setMenuMsgId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  // user data: photo, icon, rank
  const [avatarMap, setAvatarMap] = useState(() => lsGet('tvohh_avatars', {}));
  const [iconMap,   setIconMap]   = useState(() => lsGet('tvohh_profileicons', {}));
  const [rankMap,   setRankMap]   = useState({});
  const msgsRef = useRef(null);
  const channelRef = useRef(null);
  const inputRef = useRef(null);
  const latestCreatedAt = useRef(null);
  const BASE_TITLE = `${meta.icon} ${meta.label} — TVO Chat`;

  // โหลด user data (photo, icon, rank) ของทีม
  useEffect(() => {
    fetchTeamUserData(meta.label).then(({ avatarMap: av, iconMap: ic, rankMap: rk }) => {
      setAvatarMap(prev => ({ ...prev, ...av }));
      setIconMap(prev => ({ ...prev, ...ic }));
      setRankMap(rk);
    }).catch(() => {});
  }, [teamKey]);

  // Visual Viewport API — ปรับความสูงให้ถูกต้องเมื่อ keyboard เปิด/ปิดบน iOS
  useEffect(() => {
    const wrap = document.getElementById('chat-wrap');
    if (!wrap) return;
    const resize = () => {
      const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      wrap.style.height = h + 'px';
    };
    resize();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', resize);
    }
    window.addEventListener('resize', resize);
    return () => {
      if (window.visualViewport) {
        window.visualViewport.removeEventListener('resize', resize);
        window.visualViewport.removeEventListener('scroll', resize);
      }
      window.removeEventListener('resize', resize);
    };
  }, []);

  // อัปเดต tab title เมื่อมีข้อความใหม่ / reset เมื่อ focus กลับมา
  useEffect(() => {
    document.title = unread > 0 ? `(${unread}) 💬 ข้อความใหม่ — TVO Chat` : BASE_TITLE;
  }, [unread]);

  useEffect(() => {
    const reset = () => { if (document.visibilityState === 'visible') setUnread(0); };
    document.addEventListener('visibilitychange', reset);
    window.addEventListener('focus', reset);
    return () => {
      document.removeEventListener('visibilitychange', reset);
      window.removeEventListener('focus', reset);
      document.title = 'TVO Team Chat 💬'; // คืน title เมื่อออกจากหน้า
    };
  }, []);

  // scroll container โดยตรง — ไม่ใช้ scrollIntoView ซึ่งทำให้ iOS Safari เลื่อนทั้งหน้า
  const scrollToBottom = useCallback((behavior = 'smooth') => {
    setTimeout(() => {
      const el = msgsRef.current;
      if (!el) return;
      try {
        el.scrollTo({ top: el.scrollHeight, behavior });
      } catch {
        el.scrollTop = el.scrollHeight; // fallback: Safari เก่า / browser ที่ไม่รองรับ options
      }
    }, 60);
  }, []);

  // merge ข้อความใหม่เข้า state (กัน duplicate + trigger notif + นับ unread)
  const mergeNewMessages = useCallback((newMsgs, fromPoll = false) => {
    setMessages(prev => {
      const existingIds = new Set(prev.map(m => m.id));
      const added = newMsgs.filter(m => !existingIds.has(m.id));
      if (added.length === 0) return prev;
      const othersAdded = added.filter(m => m.employee_id !== session.empId);
      if (othersAdded.length > 0 && document.visibilityState === 'hidden') {
        setUnread(n => n + othersAdded.length);
      }
      if (fromPoll && notifOn) {
        othersAdded.forEach(m =>
          showNotif(`${meta.icon} ${meta.label}`, `${m.display_name}: ${m.message}`)
        );
      }
      return [...prev, ...added];
    });
  }, [notifOn, session.empId, meta]);

  // Load initial messages
  useEffect(() => {
    (async () => {
      try {
        const msgs = await fetchMessages(teamKey);
        setMessages(msgs);
        if (msgs.length > 0) latestCreatedAt.current = msgs[msgs.length - 1].created_at;
        scrollToBottom('instant');
      } catch(e) { setError(e.message); }
    })();
  }, [teamKey]);

  // Realtime subscription (ถ้า Replication เปิดอยู่จะทำงานทันที)
  useEffect(() => {
    const ch = supabase.channel(`chat_${teamKey}`)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'chat_messages',
        filter: `team=eq.${teamKey}`,
      }, (payload) => {
        const msg = payload.new;
        setMessages(prev => {
          if (prev.find(m => m.id === msg.id)) return prev;
          if (msg.employee_id !== session.empId) {
            if (document.visibilityState === 'hidden') setUnread(n => n + 1);
            if (notifOn) showNotif(`${meta.icon} ${meta.label}`, `${msg.display_name}: ${msg.message}`);
          }
          return [...prev, msg];
        });
        latestCreatedAt.current = msg.created_at;
        scrollToBottom();
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'chat_messages', filter:`team=eq.${teamKey}` }, (payload) => {
        setMessages(prev => prev.map(m => m.id === payload.new.id ? { ...m, ...payload.new } : m));
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'chat_messages', filter:`team=eq.${teamKey}` }, (payload) => {
        setMessages(prev => prev.filter(m => m.id !== payload.old.id));
      })
      .subscribe();
    channelRef.current = ch;
    return () => { supabase.removeChannel(ch); };
  }, [teamKey, notifOn, session.empId]);

  // Polling ทุก 5 วินาที — fallback กรณี Realtime ยังไม่ได้เปิด Replication
  // หยุด poll เมื่อ page อยู่ background (Page Visibility API) เพื่อประหยัด resource
  useEffect(() => {
    const poll = async () => {
      if (document.visibilityState === 'hidden') return; // หยุดถ้า page ซ่อนอยู่
      try {
        const since = latestCreatedAt.current;
        if (!since) return;
        const { data } = await supabase
          .from('chat_messages')
          .select('id,employee_id,display_name,message,created_at')
          .eq('team', teamKey)
          .gt('created_at', since)
          .order('created_at', { ascending: true });
        if (data && data.length > 0) {
          mergeNewMessages(data, true);
          latestCreatedAt.current = data[data.length - 1].created_at;
          scrollToBottom();
        }
      } catch {}
    };
    // poll ทันทีเมื่อ page กลับมา visible
    const onVisible = () => { if (document.visibilityState === 'visible') poll(); };
    document.addEventListener('visibilitychange', onVisible);
    const timer = setInterval(poll, 5000);
    return () => { clearInterval(timer); document.removeEventListener('visibilitychange', onVisible); };
  }, [teamKey, mergeNewMessages]);

  const handleEditStart = (msg) => { setEditingId(msg.id); setEditText(msg.message); };
  const handleEditCancel = () => { setEditingId(null); setEditText(''); };
  const handleEditSave = async () => {
    if (!editText.trim() || editText.trim() === messages.find(m=>m.id===editingId)?.message) { handleEditCancel(); return; }
    try {
      await sbEditMessage(editingId, session.empId, editText);
      setMessages(prev => prev.map(m => m.id===editingId ? {...m, message:editText.trim(), edited:true} : m));
    } catch(e) { setError(e.message); }
    handleEditCancel();
  };
  const handleDelete = async (id) => {
    if (!window.confirm('ลบข้อความนี้?')) return;
    try {
      await sbDeleteMessage(id, session.empId);
      setMessages(prev => prev.filter(m => m.id !== id));
    } catch(e) { setError(e.message); }
  };

  const handleSend = async () => {
    const text = input.trim();
    if (!text || sending) return;
    setSending(true);
    setError('');
    try {
      const newMsg = await sendMessage(teamKey, session.empId, session.displayName, text);
      setMessages(prev => prev.find(m => m.id === newMsg.id) ? prev : [...prev, newMsg]);
      latestCreatedAt.current = newMsg.created_at;
      setInput('');
      inputRef.current?.focus();
      scrollToBottom();
    } catch(e) { setError(e.message); }
    finally { setSending(false); }
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  const toggleNotif = async () => {
    if (!notifOn) {
      const ok = await requestNotifPermission();
      if (!ok) { setError('กรุณาอนุญาต Notification ในเบราว์เซอร์ก่อน'); return; }
    }
    const next = !notifOn;
    setNotifOn(next);
    lsSet('tvohh_chat_notif', next);
  };

  // Group messages by date
  const grouped = [];
  let lastDate = null;
  messages.forEach(msg => {
    const d = fmtDate(msg.created_at);
    if (d !== lastDate) { grouped.push({ type:'divider', label:d }); lastDate = d; }
    grouped.push({ type:'msg', msg });
  });

  const remaining = MAX_LEN - input.length;

  return (
    <div id="chat-wrap" style={{ background:'#F9FAFB' }}>
      {/* Header */}
      <div style={{
        background: meta.color, color:'#fff',
        padding:'12px 16px', paddingTop:'max(12px, env(safe-area-inset-top))',
        display:'flex', alignItems:'center', gap:'12px',
        boxShadow:'0 2px 8px rgba(0,0,0,0.15)', flexShrink:0,
      }}>
        <button onClick={onBack} style={{
          background:'rgba(255,255,255,0.2)', border:'none', color:'#fff',
          borderRadius:'8px', padding:'6px 10px', cursor:'pointer', fontSize:'16px',
        }}>←</button>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'Prompt,sans-serif', fontWeight:700, fontSize:'16px' }}>
            {meta.icon} {meta.label}
          </div>
          <div style={{ fontSize:'12px', opacity:0.85 }}>แชทภายในทีม • เก็บข้อมูล 30 วัน</div>
          <div style={{ fontSize:'11px', opacity:0.8, marginTop:2 }}>โปรดพิมพ์ข้อความสุภาพ ให้เกียรติกันด้วยนะคะ 🙏</div>
        </div>
        {/* Notification toggle — ซ่อนบน iOS Safari ที่ไม่รองรับ */}
        {NOTIF_SUPPORTED && (
          <button onClick={toggleNotif} title={notifOn ? 'ปิดการแจ้งเตือน' : 'เปิดการแจ้งเตือน'} style={{
            background:'rgba(255,255,255,0.2)', border:'none', color:'#fff',
            borderRadius:'8px', padding:'6px 10px', cursor:'pointer', fontSize:'18px',
            transition:'background 0.2s',
          }}>
            {notifOn ? '🔔' : '🔕'}
          </button>
        )}
      </div>

      {/* Messages area — คลิก background ปิด menu */}
      <div ref={msgsRef} onClick={() => setMenuMsgId(null)} style={{
        flex:1, overflowY:'auto', padding:'12px 16px',
        display:'flex', flexDirection:'column',
        WebkitOverflowScrolling:'touch',
      }}>
        {messages.length === 0 && (
          <div style={{
            flex:1, display:'flex', flexDirection:'column', alignItems:'center',
            justifyContent:'center', gap:'8px', color:'#9CA3AF', paddingTop:'60px',
          }}>
            <div style={{ fontSize:'40px' }}>💬</div>
            <div style={{ fontSize:'14px' }}>ยังไม่มีข้อความ เริ่มสนทนากันได้เลย!</div>
          </div>
        )}
        {grouped.map((item, i) =>
          item.type === 'divider'
            ? <DateDivider key={`d${i}`} label={item.label} />
            : <MessageBubble
                key={item.msg.id}
                msg={item.msg}
                isOwn={item.msg.employee_id === session.empId}
                teamColor={meta.color}
                photo={avatarMap[item.msg.display_name] || null}
                icon={iconMap[item.msg.display_name] || null}
                rankPos={rankMap[item.msg.display_name] ?? null}
                menuOpen={menuMsgId === item.msg.id}
                onMenuToggle={id => setMenuMsgId(prev => prev===id ? null : id)}
                onEdit={handleEditStart}
                onDelete={handleDelete}
                isEditing={editingId === item.msg.id}
                editText={editText}
                onEditChange={setEditText}
                onEditSave={handleEditSave}
                onEditCancel={handleEditCancel}
              />
        )}
        {error && (
          <div style={{
            background:'#FEE2E2', color:'#991B1B', padding:'8px 12px',
            borderRadius:'8px', fontSize:'13px', marginTop:'8px',
          }}>{error}</div>
        )}
      </div>

      {/* Input area — flexShrink:0 ทำให้ไม่ถูกบีบออกจากจอ */}
      <div style={{
        background:'#fff', borderTop:'1px solid #E5E7EB',
        padding:'10px 12px 10px',
        flexShrink:0, flexGrow:0,
      }}>
        <div style={{ display:'flex', gap:'8px', alignItems:'flex-end' }}>
          <div style={{ flex:1, position:'relative' }}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value.slice(0, MAX_LEN))}
              onKeyDown={handleKey}
              placeholder="พิมพ์ข้อความ... (Enter ส่ง)"
              rows={1}
              style={{
                width:'100%', resize:'none', border:'1.5px solid #D1FAE5',
                borderRadius:'12px', padding:'10px 14px',
                fontSize:'14px', fontFamily:'Sarabun,sans-serif',
                outline:'none', lineHeight:1.5, maxHeight:'120px',
                overflowY:'auto',
                transition:'border-color 0.2s',
              }}
              onFocus={e => e.target.style.borderColor = meta.color}
              onBlur={e => e.target.style.borderColor = '#D1FAE5'}
            />
            {input.length > 0 && (
              <div style={{
                position:'absolute', right:'10px', bottom:'6px',
                fontSize:'10px', color: remaining < 50 ? '#EF4444' : '#9CA3AF',
              }}>{remaining}</div>
            )}
          </div>
          <button
            onClick={handleSend}
            disabled={!input.trim() || sending}
            style={{
              background: input.trim() ? meta.color : '#E5E7EB',
              color: input.trim() ? '#fff' : '#9CA3AF',
              border:'none', borderRadius:'12px',
              width:'44px', height:'44px', cursor: input.trim() ? 'pointer' : 'default',
              fontSize:'20px', display:'flex', alignItems:'center', justifyContent:'center',
              transition:'background 0.2s', flexShrink:0,
            }}
          >
            {sending ? '⏳' : '➤'}
          </button>
        </div>
      </div>
    </div>
  );
}

function TeamSelector({ session, onSelect }) {
  const myTeamKey = getTeamKey(session.group);

  return (
    <div style={{ minHeight:'100vh', background:'#F0FDF4' }}>
      {/* Back link — เลื่อนลงมา 2 บรรทัด */}
      <div style={{
        background:'#16A34A',
        paddingTop:'max(52px, calc(env(safe-area-inset-top) + 36px))',
        paddingLeft:'16px', paddingRight:'16px', paddingBottom:'0',
      }}>
        <a href="index.html" style={{
          display:'inline-flex', alignItems:'center', gap:'6px',
          background:'rgba(255,255,255,0.2)', color:'#fff',
          borderRadius:'8px', padding:'6px 12px', textDecoration:'none', fontSize:'13px',
        }}>← กลับหน้าแอพ</a>
      </div>
      {/* Header */}
      <div style={{
        background:'#16A34A', color:'#fff',
        padding:'12px 16px 16px',
        display:'flex', alignItems:'center', gap:'12px',
      }}>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'Prompt,sans-serif', fontWeight:700, fontSize:'18px' }}>
            💬 TVO Team Chat
          </div>
          <div style={{ fontSize:'12px', opacity:0.85 }}>สนทนาภายในทีม</div>
        </div>
        <Avatar name={session.displayName} color="rgba(255,255,255,0.3)" size={36} />
      </div>

      {/* Greeting */}
      <div style={{ padding:'20px 16px 8px' }}>
        <div style={{ color:'#374151', fontSize:'14px' }}>
          สวัสดี <strong>{session.displayName}</strong> 👋
        </div>
        <div style={{ color:'#6B7280', fontSize:'13px', marginTop:'4px' }}>
          ทีมของคุณคือ {myTeamKey ? `${TEAM_META[myTeamKey]?.icon} ${TEAM_META[myTeamKey]?.label}` : 'ไม่ระบุ'}
        </div>
      </div>

      {/* Team cards */}
      <div style={{ padding:'12px 16px', display:'flex', flexDirection:'column', gap:'12px' }}>
        {Object.entries(TEAM_META).map(([key, meta]) => {
          const isMyTeam = key === myTeamKey;
          return (
            <button
              key={key}
              onClick={() => isMyTeam && onSelect(key)}
              disabled={!isMyTeam}
              style={{
                background: isMyTeam ? meta.bg : '#F9FAFB',
                border: `2px solid ${isMyTeam ? meta.color : '#E5E7EB'}`,
                borderRadius:'16px', padding:'16px 20px',
                display:'flex', alignItems:'center', gap:'16px',
                cursor: isMyTeam ? 'pointer' : 'not-allowed',
                textAlign:'left', opacity: isMyTeam ? 1 : 0.45,
                boxShadow: isMyTeam ? `0 2px 12px ${meta.color}30` : 'none',
                transition:'transform 0.15s',
              }}
              onMouseDown={e => isMyTeam && (e.currentTarget.style.transform='scale(0.98)')}
              onMouseUp={e => isMyTeam && (e.currentTarget.style.transform='scale(1)')}
              onMouseLeave={e => isMyTeam && (e.currentTarget.style.transform='scale(1)')}
            >
              <div style={{
                fontSize:'28px', width:'48px', height:'48px',
                display:'flex', alignItems:'center', justifyContent:'center',
                background: `${meta.color}${isMyTeam ? '20' : '10'}`, borderRadius:'12px',
              }}>{meta.icon}</div>
              <div style={{ flex:1 }}>
                <div style={{
                  fontFamily:'Prompt,sans-serif', fontWeight:700, fontSize:'15px',
                  color: isMyTeam ? meta.color : '#9CA3AF',
                }}>{meta.label}</div>
                <div style={{ fontSize:'12px', color:'#9CA3AF', marginTop:'2px' }}>
                  {isMyTeam ? '✅ ทีมของคุณ — แตะเพื่อเข้าแชท' : '🔒 เฉพาะสมาชิกในทีมเท่านั้น'}
                </div>
              </div>
              <div style={{ fontSize:'20px', color: isMyTeam ? meta.color : '#D1D5DB' }}>
                {isMyTeam ? '›' : '🔒'}
              </div>
            </button>
          );
        })}
      </div>

      {/* Info */}
      <div style={{
        margin:'8px 16px 24px',
        background:'#ECFDF5', border:'1px solid #A7F3D0',
        borderRadius:'12px', padding:'12px 16px',
        fontSize:'12px', color:'#065F46', lineHeight:1.7,
      }}>
        ℹ️ ข้อความจะถูกเก็บ <strong>30 วัน</strong> และลบโดยอัตโนมัติ<br/>
        ไม่รองรับการส่งรูปภาพหรือไฟล์
      </div>
    </div>
  );
}

// ── Main App — เข้าแชทของทีมตัวเองทันที ─────────────────────
function App() {
  const session = getSession();

  if (!session) return <NotLoggedIn />;

  const teamKey = getTeamKey(session.group);

  if (!teamKey) {
    return (
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:'12px', padding:'24px' }}>
        <div style={{ fontSize:'40px' }}>⚠️</div>
        <div style={{ fontFamily:'Prompt,sans-serif', fontWeight:700, color:'#92400E', fontSize:'16px' }}>ไม่พบข้อมูลทีม</div>
        <div style={{ color:'#6B7280', fontSize:'13px', textAlign:'center' }}>กรุณาติดต่อ Admin เพื่อกำหนดทีมของคุณ</div>
        <a href="index.html" style={{ color:'#16A34A', fontSize:'14px' }}>← กลับหน้าแอพ</a>
      </div>
    );
  }

  return <ChatRoom session={session} teamKey={teamKey} onBack={() => { location.href = 'index.html'; }} />;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
