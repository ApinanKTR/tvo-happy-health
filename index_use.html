const lsGet = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(_e) { return fallback; } };
const lsSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(_e) {} };

// บีบอัดรูปให้ไม่เกิน 300KB — ลด quality ซ้ำจนถึงขนาดที่กำหนด
const resizeImage = (file, maxPx = 800, maxBytes = 300000) => new Promise(resolve => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(blobUrl);
    // ลด quality ซ้ำจนขนาด base64 ไม่เกิน maxBytes
    let q = 0.8;
    let b64 = c.toDataURL("image/jpeg", q);
    while (b64.length * 0.75 > maxBytes && q > 0.1) {
      q = Math.max(0.1, q - 0.1);
      b64 = c.toDataURL("image/jpeg", q);
    }
    resolve(b64);
  };
  img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(null); };
  img.src = blobUrl;
});

// --- เพิ่มฟังก์ชันแปลง Base64 และอัปโหลดไปยัง Storage ตรงนี้ ---
  const base64ToBlob = (base64Str) => {
    const parts = base64Str.split(';base64,');
    const contentType = parts[0].split(':')[1];
    const raw = window.atob(parts[1]);
    const rawLength = raw.length;
    const uInt8Array = new Uint8Array(rawLength);
    for (let i = 0; i < rawLength; ++i) {
      uInt8Array[i] = raw.charCodeAt(i);
    }
    return new Blob([uInt8Array], { type: contentType });
  };

  const uploadImageToStorage = async (base64Str, folder = 'logs') => {
    if (!base64Str) return null;
    try {
      const blob = base64ToBlob(base64Str);
      // เปลี่ยนจากโครงสร้าง folder/ ให้เป็นชื่อไฟล์แบนๆ ตรงๆ เพื่อให้เซฟลง Bucket ได้ชัวร์ๆ
      const fileName = `${folder}-${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;
      
      const { data, error } = await supabase.storage
        .from('exercise-photos')
        .upload(fileName, blob, {
          contentType: 'image/jpeg',
          upsert: true
        });

      if (error) throw error;

      const { data: { publicUrl } } = supabase.storage
        .from('exercise-photos')
        .getPublicUrl(fileName);

      return publicUrl;
    } catch (err) {
      console.error("Storage Upload Error:", err.message);
      return null;
    }
  };

const getLast7Days = (userLogs) => {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().split("T")[0];
    const cal = userLogs.filter(l => l.date === ds).reduce((s, l) => s + l.calories, 0);
    days.push({ date: ds, cal, label: ["อา","จ","อ","พ","พฤ","ศ","ส"][d.getDay()] });
  }
  return days;
};

              </div>

              {(editForm.avatar!==undefined&&editForm.avatar!==null)&&<button onClick={()=>setEditForm(p=>({...p,avatar:null}))} style={{ marginTop:6, background:"none", border:"none", color:"#9CA3AF", fontSize:11, cursor:"pointer", textDecoration:"underline" }}>ลบรูปภาพ</button>}
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button className="v2-btn-ghost" onClick={()=>setShowEditProfile(false)} style={{ flex:1, padding:13, fontSize:13 }}>ยกเลิก</button>
              <button className="v2-btn-primary" onClick={handleSaveProfile} style={{ flex:2, padding:13, fontSize:13 }}>💾 บันทึก</button>
            </div>
          </div>
        </div>
      )}

      {/* ── MAIN CONTENT ── */}
      <div style={{ position:"relative", zIndex:1, maxWidth:680, width:"100%", margin:"0 auto", padding:"calc(env(safe-area-inset-top,0px) + 16px) 14px calc(100px + env(safe-area-inset-bottom,0px))" }}>

        {/* ── HEADER v2 ── */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, opacity:animateIn?1:0, transform:animateIn?"none":"translateY(-16px)", transition:"all .5s ease" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ width:40, height:40, borderRadius:12, background:"#FFFFFF", boxShadow:"0 2px 10px rgba(22,163,74,0.20)", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
              <img src="logo.png" alt="TVO" style={{ width:32, height:32, objectFit:"contain" }} />
            </div>
            <div>
              <div style={{ fontFamily:"'Prompt'", fontWeight:900, fontSize:17, background:"linear-gradient(135deg,#15803D,#22C55E)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", lineHeight:1.2 }}>TVO Calories Challenge</div>
              <div style={{ fontSize:9.5, color:"#9CA3AF", letterSpacing:1.5, textTransform:"uppercase" }}>Happy Health 2026</div>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {/* Connection status dot */}
            <div style={{ width:8, height:8, borderRadius:"50%", background: spStatus==="connected"?"#22C55E":spStatus==="error"?"#EF4444":"#F59E0B", boxShadow: spStatus==="connected"?"0 0 6px #22C55E":"none", animation: spStatus==="connecting"?"v2pulse 1.2s infinite":"none" }} title={spStatus==="connected"?`Sync ${spLastSync}`:spStatus} />
            {/* User chip */}
            <div onClick={()=>{ setEditForm({displayName:authUser.displayName,avatar:undefined}); setShowEditProfile(true); }} style={{ display:"flex", alignItems:"center", gap:8, background:"#FFFFFF", border:"1px solid #D1FAE5", borderRadius:999, padding:"5px 12px 5px 6px", cursor:"pointer", boxShadow:"0 2px 8px rgba(0,0,0,0.06)", transition:"box-shadow .2s" }} title="แก้ไขโปรไฟล์">
              {authUser?.avatar
                ?<img src={authUser.avatar} style={{ width:30, height:30, borderRadius:"50%", objectFit:"cover", border:"2px solid #22C55E" }} alt="av" />
                :<div style={{ width:30, height:30, borderRadius:"50%", background:"linear-gradient(135deg,#16A34A,#4ADE80)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15 }}>👤</div>}
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:"#111827", lineHeight:1.2, maxWidth:80, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{authUser?.displayName}</div>
                <div style={{ fontSize:9.5, color:"#9CA3AF", lineHeight:1.2 }}>{grpLabel(authUser?.group)}</div>
              </div>
            </div>
            <button onClick={handleLogout} style={{ background:"none", border:"1.5px solid #E5E7EB", borderRadius:10, padding:"6px 10px", cursor:"pointer", fontSize:11, color:"#9CA3AF", fontFamily:"'Sarabun'", transition:"all .2s" }}>ออก</button>
          </div>
        </div>

        {/* ── STATS BAR v2 ── */}
        {(() => {
          const totalCal = logs.reduce((s,l)=>s+l.calories,0);
          const TARGET = 1000000;
          const pct = Math.min(100, (totalCal / TARGET) * 100);
          const calDisplay = totalCal.toLocaleString();
          return (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:22, opacity:animateIn?1:0, transition:"all .5s ease .15s" }}>
              {/* Calorie card — special with progress */}
              <div className="v2-card" style={{ padding:"14px 8px", textAlign:"center", gridColumn:"1" }}>
                <div style={{ width:36, height:36, borderRadius:11, background:"linear-gradient(135deg,#16A34A,#22C55E)", margin:"0 auto 8px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, boxShadow:"0 4px 12px rgba(22,163,74,0.25)" }}>🔥</div>
                <div style={{ fontFamily:"'Prompt'", fontSize:19, fontWeight:800, color:"#111827", lineHeight:1 }}>{calDisplay}</div>
                <div style={{ fontSize:8.5, color:"#16A34A", fontWeight:700, marginTop:2 }}>{pct.toFixed(1)}% of 1M</div>
                <div style={{ background:"#F3F4F6", borderRadius:999, height:5, overflow:"hidden", margin:"5px 4px 0" }}>
                  <div style={{ height:"100%", borderRadius:999, background:"linear-gradient(90deg,#16A34A,#22C55E)", width:`${pct}%`, transition:"width 1s cubic-bezier(.25,.46,.45,.94)" }} />
                </div>
              </div>
              {/* Session card */}
              <div className="v2-card" style={{ padding:"14px 8px", textAlign:"center" }}>
                <div style={{ width:36, height:36, borderRadius:11, background:"linear-gradient(135deg,#0891B2,#06B6D4)", margin:"0 auto 8px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, boxShadow:"0 4px 12px rgba(8,145,178,0.22)" }}>⚡</div>
                <div style={{ fontFamily:"'Prompt'", fontSize:20, fontWeight:800, color:"#111827", lineHeight:1 }}>{logs.length}</div>
                <div style={{ fontSize:9.5, color:"#9CA3AF", marginTop:4, lineHeight:1.3 }}>ครั้ง<br/>เซสชั่น</div>
              </div>
              {/* Members card */}
              <div className="v2-card" style={{ padding:"14px 8px", textAlign:"center" }}>
                <div style={{ width:36, height:36, borderRadius:11, background:"linear-gradient(135deg,#7C3AED,#8B5CF6)", margin:"0 auto 8px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, boxShadow:"0 4px 12px rgba(124,58,237,0.22)" }}>👥</div>
                <div style={{ fontFamily:"'Prompt'", fontSize:20, fontWeight:800, color:"#111827", lineHeight:1 }}>{[...new Set(logs.map(l=>l.user))].length}</div>
                <div style={{ fontSize:9.5, color:"#9CA3AF", marginTop:4, lineHeight:1.3 }}>คน<br/>ผู้เข้าร่วม</div>
              </div>
            </div>
          );
        })()}

        {/* ── CONTENT TABS v2 ── */}

        {/* ───── DASHBOARD ───── */}
        {activeTab==="dashboard" && (
          <div className="v2-in-anim">
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
              <h2 className="v2-section-title" style={{ marginBottom:0 }}>📋 บันทึกล่าสุด</h2>
              <div className="tab-scroll" style={{ gap:5 }}>
                {[{id:"newest",label:"ใหม่สุด"},{id:"oldest",label:"เก่าสุด"},{id:"name",label:"ชื่อ"},{id:"exercise",label:"กีฬา"},{id:"calories",label:"kcal🔥"}].map(s=>(
                  <button key={s.id} className="v2-sort" onClick={()=>setDashSort(s.id)}
                    style={{ background:dashSort===s.id?"#16A34A":"#FFFFFF", color:dashSort===s.id?"#fff":"#6B7280", border:dashSort===s.id?"none":"1px solid #E5E7EB", fontWeight:dashSort===s.id?700:500 }}>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {[...logs].sort((a,b)=>{
                if(dashSort==="newest") return b.date>a.date?1:b.date<a.date?-1:0;
                if(dashSort==="oldest") return a.date>b.date?1:a.date<b.date?-1:0;
                if(dashSort==="name") return a.user.localeCompare(b.user,"th");
                if(dashSort==="exercise") return a.exercise.localeCompare(b.exercise,"th");
                if(dashSort==="calories") return b.calories-a.calories;
                return 0;
              }).slice(0,30).map(log=>{
                const ex=exercises.find(e=>e.name===log.exercise);
                const color=getGroupColor(log.group);
                const liked=likedLogs.has(log.id);
                const logAv=avatars[log.user];
                return (
                  <div key={log.id} className="v2-card" style={{ padding:"14px 16px", borderLeft:`4px solid ${color}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                      {/* Profile avatar (แทน exercise icon) */}
                      <div onClick={()=>{ setProfileUser(log.user); setProfileFilter("all"); setActiveTab("profile"); }} style={{ width:44, height:44, borderRadius:"50%", overflow:"hidden", flexShrink:0, border:`2px solid ${color}55`, background:`${color}18`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, cursor:"pointer" }}>
                        {logAv?<img src={logAv} style={{ width:"100%", height:"100%", objectFit:"cover" }} alt="" />:<span>👤</span>}
                      </div>
                      {/* Info */}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:3, flexWrap:"wrap" }}>
                          <span onClick={()=>{ setProfileUser(log.user); setProfileFilter("all"); setActiveTab("profile"); }} style={{ fontWeight:700, fontFamily:"'Prompt'", fontSize:14, cursor:"pointer", color:"#111827" }}>{log.user}</span>
                          <span style={{ fontSize:10, background:`${color}18`, color, borderRadius:999, padding:"2px 8px", fontWeight:700 }}>{grpLabel(log.group)}</span>
                        </div>
                        <div style={{ color:"#6B7280", fontSize:12 }}>{log.exercise} · {log.duration} นาที · {log.date}</div>
                        {log.note&&<div style={{ color:"#9CA3AF", fontSize:11, marginTop:3, fontStyle:"italic" }}>"{log.note}"</div>}
                        <div style={{ marginTop:8, display:"flex", alignItems:"center", gap:8 }}>
                          <button className={`v2-like ${liked?"v2-like-on":""}`} onClick={()=>handleLike(log.id)}>
                            {liked?"❤️":"🤍"} <span>{log.likes}</span>
                          </button>
                          {log.photo&&<div className="v2-pthumb" onClick={()=>setZoomPhoto(log.photo)} style={{ width:30, height:30 }}><img src={log.photo} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", borderRadius:8 }} /></div>}
                        </div>
                      </div>
                      {/* Calorie chip + exercise icon */}
                      <div style={{ flexShrink:0, textAlign:"center", background:`linear-gradient(135deg,${color}18,${color}0a)`, borderRadius:14, padding:"8px 12px", border:`1px solid ${color}22` }}>
                        <div style={{ width:28, height:28, borderRadius:8, background:`${color}22`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, margin:"0 auto 4px", overflow:"hidden" }}>
                          {ex?.image?<img src={ex.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />:(ex?.icon||"🏃")}
                        </div>
                        <div style={{ fontFamily:"'Prompt'", fontWeight:800, fontSize:18, color, lineHeight:1 }}>{log.calories}</div>
                        <div style={{ fontSize:9.5, color:"#9CA3AF", marginTop:2 }}>kcal</div>
                      </div>
                    </div>
                  </div>
                );
              })}
              {logs.length===0&&<div style={{ textAlign:"center", padding:"48px 0", color:"#9CA3AF", fontSize:14 }}>ยังไม่มีข้อมูล — ลองบันทึกการออกกำลังกายแรก!</div>}
            </div>
          </div>
        )}

        {/* ───── ADD ───── */}
        {activeTab==="add" && (
          <div className="v2-in-anim">
            <div className="v2-card" style={{ padding:22 }}>
              <h2 className="v2-section-title">🏃 บันทึกการออกกำลังกาย</h2>

              {/* User chip */}
              <div style={{ background:"linear-gradient(135deg,#F0FDF4,#DCFCE7)", border:"1px solid #A7F3D0", borderRadius:16, padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  {authUser?.avatar?<img src={authUser.avatar} style={{ width:38, height:38, borderRadius:"50%", objectFit:"cover", border:"2px solid #22C55E" }} alt="av" />:<div style={{ width:38, height:38, borderRadius:"50%", background:"linear-gradient(135deg,#16A34A,#4ADE80)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:19 }}>👤</div>}
                  <div>
                    <div style={{ fontFamily:"'Prompt'", fontWeight:700, fontSize:14, color:"#15803D" }}>{authUser?.displayName}</div>
                    <div style={{ fontSize:11, color:"#6B7280" }}>{authUser?.group}</div>
                  </div>
                </div>
                <div style={{ fontSize:11, color:"#16A34A", fontWeight:600, background:"#FFFFFF", borderRadius:999, padding:"3px 10px", border:"1px solid #D1FAE5" }}>ผู้บันทึก</div>
              </div>

              {/* Exercise selector */}
              <div style={{ marginBottom:20 }}>
                <label style={{ fontSize:12, color:"#374151", display:"block", marginBottom:10, fontWeight:700 }}>🎯 ประเภทการออกกำลังกาย</label>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:7 }}>
                  {exercises.map(ex=>{
                    const sel=form.exercise===ex.name;
                    const c=getGroupColor(form.group);
                    return (
                      <button key={ex.id} onClick={()=>setForm(p=>({...p,exercise:ex.name}))}
                        className={`v2-ex-btn ${sel?"v2-ex-on":""}`}
                        style={{ borderColor:sel?c:"#E5E7EB" }}>
                        <div style={{ width:30, height:30, borderRadius:9, overflow:"hidden", margin:"0 auto 4px", background:"#F0FDF4", display:"flex", alignItems:"center", justifyContent:"center" }}>
                          {ex.image?<img src={ex.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />:<span style={{ fontSize:17 }}>{ex.icon}</span>}
                        </div>
                        <div style={{ fontSize:9.5, color:sel?c:"#6B7280", fontWeight:600, lineHeight:1.2 }}>{ex.name}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Date */}
              <div style={{ marginBottom:20 }}>
                <label style={{ fontSize:12, color:"#374151", display:"block", marginBottom:8, fontWeight:700 }}>📅 วันที่</label>
                <input type="date" value={form.date} max={new Date().toISOString().split("T")[0]}
                  onChange={e=>setForm(p=>({...p,date:e.target.value}))}
                  style={{ width:"100%", padding:"12px 16px", borderRadius:14, fontSize:14, border:"1.5px solid #D1FAE5", color:"#15803D", fontWeight:600 }} />
              </div>

              {/* Duration */}
              <div style={{ marginBottom:20 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                  <label style={{ fontSize:12, color:"#374151", fontWeight:700 }}>⏱️ ระยะเวลา</label>
                  <input
                    type="number" min={15} max={480} value={form.duration}
                    onChange={e => { const v = Math.max(15, Math.min(480, +e.target.value||15)); setForm(p=>({...p,duration:v})); }}
                    style={{ width:72, padding:"4px 8px", borderRadius:10, border:"1.5px solid #D1FAE5", fontFamily:"'Prompt'", fontWeight:700, fontSize:15, color:"#16A34A", textAlign:"center", outline:"none", background:"#F0FDF4" }}
                  />
                </div>
                <input type="range" min={15} max={480} step={1} value={form.duration} onChange={e=>setForm(p=>({...p,duration:+e.target.value}))} style={{ width:"100%", accentColor:"#16A34A", borderRadius:999, border:"none", background:"transparent" }} />
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#9CA3AF", marginTop:4 }}><span>15 น.</span><span>480 น.</span></div>
              </div>

              {/* Note */}
              <div style={{ marginBottom:20 }}>
                <label style={{ fontSize:12, color:"#374151", display:"block", marginBottom:8, fontWeight:700 }}>📝 บันทึก</label>
                <textarea value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))} placeholder="เช่น วิ่งตอนเช้า รู้สึกดีมาก..." rows={2} style={{ width:"100%", padding:"12px 14px", borderRadius:14, fontSize:13 }} />
              </div>

              {/* Photo */}
              <div style={{ marginBottom:20 }}>
                <label style={{ fontSize:12, color:"#374151", display:"block", marginBottom:8, fontWeight:700 }}>📸 รูปการออกกำลังกาย <span style={{ color:"#DC2626", fontWeight:800 }}>*</span> <span style={{ color:"#9CA3AF", fontWeight:400, fontSize:11 }}>(บังคับ)</span></label>
                {form.photo?(
                  <div style={{ position:"relative" }}>
                    <img src={form.photo} alt="" onClick={()=>setZoomPhoto(form.photo)} className="v2-pthumb" style={{ width:"100%", maxHeight:200, objectFit:"cover", borderRadius:16, display:"block" }} />
                    <button onClick={()=>setForm(p=>({...p,photo:null}))} style={{ position:"absolute", top:8, right:8, background:"rgba(0,0,0,0.65)", border:"none", color:"#fff", borderRadius:"50%", width:30, height:30, cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
                    <button onClick={()=>addPhotoRef.current?.click()} style={{ position:"absolute", bottom:8, right:8, background:"rgba(22,163,74,0.85)", border:"none", color:"#fff", borderRadius:8, padding:"5px 12px", cursor:"pointer", fontSize:11, fontFamily:"'Sarabun'", fontWeight:600 }}>เปลี่ยนรูป</button>
                  </div>
                ):(
                  <div className="v2-upload" onClick={()=>addPhotoRef.current?.click()} style={{ padding:"26px 16px" }}>
                    <div style={{ fontSize:30, marginBottom:6 }}>📸</div>
                    <div style={{ fontSize:13, color:"#6B7280" }}>แตะเพื่อเลือกรูปภาพ</div>
                    <div style={{ fontSize:10, color:"#9CA3AF", marginTop:3 }}>PNG / JPG / WEBP (บีบอัดอัตโนมัติ)</div>
                  </div>
                )}
                <input ref={addPhotoRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e=>handlePhotoUpload(e.target.files[0])} />
              </div>

              {/* kcal entry */}
              <div style={{ marginBottom:22 }}>
                <div style={{ marginBottom:12 }}>
                  <button onClick={()=>setShowAppLinks(p=>!p)} className="v2-btn-ghost" style={{ width:"100%", padding:"10px", fontSize:12, display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                    <span>📱 ดู kcal จากแอพวิ่ง</span><span>{showAppLinks?"▲":"▼"}</span>
                  </button>
                  {showAppLinks&&(
                    <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:8 }}>
                      {RUN_APPS.map(app=>(
                        <a key={app.name} href={app.url} target="_blank" rel="noopener noreferrer"
                          style={{ display:"flex", alignItems:"center", gap:12, background:"#FAFFFE", border:`1.5px solid ${app.color}22`, borderRadius:14, padding:"11px 14px", textDecoration:"none" }}>
                          <div style={{ width:36, height:36, borderRadius:10, background:app.color+"18", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>{app.icon}</div>
                          <div style={{ flex:1 }}>
                            <div style={{ fontWeight:700, fontSize:13, color:app.color }}>{app.name}</div>
                            <div style={{ fontSize:10, color:"#9CA3AF", marginTop:1 }}>{app.hint}</div>
                          </div>
                          <span style={{ fontSize:11, color:"#9CA3AF" }}>เปิด →</span>
                        </a>
                      ))}
                    </div>
                  )}
                </div>
                <label style={{ fontSize:12, color:"#374151", display:"block", marginBottom:10, fontWeight:700 }}>🔥 กรอก kcal</label>
                <div style={{ display:"flex", alignItems:"center", gap:12, background:"#F0FDF4", borderRadius:18, padding:"8px 16px", border:"1.5px solid #D1FAE5" }}>
                  <input type="number" min={1} max={9999} value={form.customCal} onChange={e=>setForm(p=>({...p,customCal:Math.min(9999,Math.max(1,+e.target.value||1))}))}
                    style={{ flex:1, padding:"8px 4px", background:"transparent", border:"none", fontSize:28, fontWeight:800, color:"#16A34A", textAlign:"center", boxShadow:"none" }} />
                  <span style={{ fontSize:14, color:"#6B7280", fontWeight:700 }}>kcal</span>
                </div>
              </div>

              {dailyFull?(
                <div style={{ background:"#F3F4F6", borderRadius:16, padding:"14px 16px", textAlign:"center" }}>
                  <div style={{ fontSize:22, marginBottom:6 }}>🔒</div>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, fontSize:14, color:"#9CA3AF" }}>ครบ {DAILY_LIMIT} ครั้งแล้ววันนี้</div>
                  <div style={{ fontSize:12, color:"#9CA3AF", marginTop:4 }}>สามารถบันทึกใหม่ได้พรุ่งนี้</div>
                </div>
              ):(
                <button className="v2-btn-primary" onClick={()=>{
                  if(!form.photo){ toast("⚠️ กรุณาแนบรูปการออกกำลังกายก่อนบันทึก"); return; }
                  setShowSaveConfirm(true);
                }} style={{ width:"100%", padding:16, fontSize:15 }}>🔥 บันทึกแคลอรี่</button>
              )}
            </div>

                  </div>
                  <div style={{ marginBottom:13 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:6, fontWeight:700 }}>🖼️ รูปภาพ</label>
                    <div style={{ display:"flex", gap:9, alignItems:"center" }}>
                      {exForm.image&&<div style={{ width:50, height:50, borderRadius:11, overflow:"hidden" }}><img src={exForm.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /></div>}
                      <div className="v2-upload" onClick={()=>exImgRef.current?.click()} style={{ flex:1, padding:"12px 7px" }}>
                        <div style={{ fontSize:18, marginBottom:3 }}>📷</div><div style={{ fontSize:10.5, color:"#9CA3AF" }}>อัพโหลดรูป</div>
                      </div>
                      <input ref={exImgRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e=>handleImgUpload(e.target.files[0],setExForm)} />
                    </div>
                    {exForm.image&&<button className="v2-btn-ghost" onClick={()=>setExForm(p=>({...p,image:null}))} style={{ fontSize:11, padding:"3px 9px", marginTop:6 }}>✕ ลบรูป</button>}
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button className="v2-btn-primary" onClick={handleSaveEx} style={{ flex:1, padding:11, fontSize:13 }}>{editingEx!==null?"💾 บันทึก":"➕ เพิ่ม"}</button>
                    {editingEx!==null&&<button className="v2-btn-ghost" onClick={()=>{ setEditingEx(null); setExForm({name:"",icon:"🏃",calPerMin:5,image:null}); setShowEmojiPicker(false); }} style={{ padding:"11px 13px", fontSize:12 }}>ยกเลิก</button>}
                  </div>
                </div>
                <div style={{ fontSize:11, color:"#9CA3AF", marginBottom:8 }}>{exercises.length} ประเภท</div>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {exercises.map(ex=>(
                    <div key={ex.id} className="v2-card" style={{ padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:38, height:38, borderRadius:11, overflow:"hidden", background:"#F0FDF4", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                        {ex.image?<img src={ex.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />:<span style={{ fontSize:18 }}>{ex.icon}</span>}
                      </div>
                      <div style={{ flex:1 }}><div style={{ fontWeight:700, fontFamily:"'Prompt'", fontSize:13 }}>{ex.name}</div><div style={{ fontSize:10, color:"#9CA3AF" }}>{ex.calPerMin} kcal/นาที</div></div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button className="v2-btn-ghost" onClick={()=>handleEditEx(ex)} style={{ padding:"5px 10px", fontSize:12 }}>✏️</button>
                        <button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:ex.name,fn:()=>{ setExercises(p=>p.filter(e=>e.id!==ex.id)); setDeleteConfirm(null); }})} style={{ padding:"5px 10px", fontSize:12 }}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {adminSection==="groups"&&(
              <div>
                <div className="v2-adm-card" style={{ padding:18, marginBottom:14 }}>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, color:"#16A34A", marginBottom:13, fontSize:14 }}>{editingGrp!==null?"✏️ แก้ไขกลุ่ม":"➕ เพิ่มกลุ่มใหม่"}</div>
                  <div style={{ marginBottom:11 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:5, fontWeight:700 }}>ชื่อกลุ่ม</label>
                    <input value={grpForm.name} onChange={e=>setGrpForm(p=>({...p,name:e.target.value}))} placeholder="เช่น E : ทีมใหม่" style={{ width:"100%", padding:"10px 12px", borderRadius:11, fontSize:13 }} />
                  </div>
                  <div style={{ marginBottom:11 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:6, fontWeight:700 }}>สีประจำกลุ่ม</label>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:9 }}>
                      {PALETTE.map(c=><button key={c} onClick={()=>setGrpForm(p=>({...p,color:c}))} style={{ width:28, height:28, borderRadius:7, background:c, border:grpForm.color===c?"3px solid #fff":"2px solid transparent", cursor:"pointer", boxShadow:grpForm.color===c?`0 0 0 2px ${c}`:"none", transition:"all .15s" }} />)}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                      <div style={{ width:32, height:32, borderRadius:9, background:grpForm.color, flexShrink:0 }} />
                      <input value={grpForm.color} onChange={e=>setGrpForm(p=>({...p,color:e.target.value}))} style={{ padding:"7px 11px", borderRadius:9, fontSize:12, width:100 }} />
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button className="v2-btn-primary" onClick={handleSaveGrp} style={{ flex:1, padding:11, fontSize:13 }}>{editingGrp!==null?"💾 บันทึก":"➕ เพิ่มกลุ่ม"}</button>
                    {editingGrp!==null&&<button className="v2-btn-ghost" onClick={()=>{ setEditingGrp(null); setGrpForm({name:"",color:"#16A34A",image:null}); }} style={{ padding:"11px 13px", fontSize:12 }}>ยกเลิก</button>}
                  </div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {groups.map(g=>(
                    <div key={g.id} className="v2-card" style={{ padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:38, height:38, borderRadius:11, background:g.color+"22", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, border:`1.5px solid ${g.color}33` }}>
                        <span style={{ fontSize:18, color:g.color }}>👥</span>
                      </div>
                      <div style={{ flex:1 }}><div style={{ fontWeight:700, fontFamily:"'Prompt'", fontSize:13, color:g.color }}>{g.name}</div><div style={{ display:"flex", alignItems:"center", gap:5, marginTop:2 }}><div style={{ width:10, height:10, borderRadius:3, background:g.color }} /><span style={{ fontSize:10, color:"#9CA3AF" }}>{g.color}</span></div></div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button className="v2-btn-ghost" onClick={()=>handleEditGrp(g)} style={{ padding:"5px 10px", fontSize:12 }}>✏️</button>
                        <button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:g.name,fn:()=>{ setGroups(p=>p.filter(x=>x.id!==g.id)); setDeleteConfirm(null); }})} style={{ padding:"5px 10px", fontSize:12 }}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}


            {adminSection==="anomaly"&&(()=>{
              const anomalyLogs = logs.filter(l => isCalAnomaly(l.exercise, l.duration, l.calories));
              return (
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, fontSize:14, color:"#D97706" }}>🔍 แคลอรี่ผิดปกติ</div>
                  <div style={{ background:"#FEF3C7", border:"1px solid #FDE68A", borderRadius:999, padding:"2px 10px", fontSize:11, fontWeight:700, color:"#92400E" }}>{anomalyLogs.length} รายการ</div>
                </div>
                <div style={{ fontSize:11, color:"#9CA3AF", marginBottom:14 }}>เกณฑ์: แคลอรี่ที่บันทึก &gt; ค่าสูงสุดมาตรฐาน × 1.5</div>
                {anomalyLogs.length===0?(
                  <div style={{ textAlign:"center", padding:"40px 0", color:"#9CA3AF", fontSize:13 }}>✅ ไม่พบข้อมูลผิดปกติ</div>
                ):(
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                    {anomalyLogs.map(log=>{
                      const r = calcCalRange(log.exercise, log.duration);
                      const c = getGroupColor(log.group);
                      const overPct = r ? Math.round(((log.calories - r.max) / r.max) * 100) : 0;
                      return (
                        <div key={log.id} style={{ background:"#FFFBEB", border:"1.5px solid #FDE68A", borderRadius:13, padding:"12px 14px" }}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                              <span style={{ fontWeight:700, fontSize:13, color:"#111827" }}>{log.user}</span>
                              <span style={{ fontSize:10, background:c+"18", color:c, borderRadius:999, padding:"1px 7px", fontWeight:700 }}>{grpLabel(log.group)}</span>
                            </div>
                            <span style={{ background:"#FEF3C7", border:"1px solid #FCD34D", borderRadius:8, padding:"2px 8px", fontSize:11, fontWeight:700, color:"#B45309" }}>+{overPct}% เกินสูงสุด</span>
                          </div>
                          <div style={{ fontSize:12, color:"#6B7280", marginBottom:4 }}>{log.exercise} · {log.duration} นาที · {log.date}</div>
                          <div style={{ display:"flex", alignItems:"center", gap:12, fontSize:12 }}>
                            <span>บันทึก: <strong style={{ color:"#DC2626" }}>{log.calories} kcal</strong></span>
                            <span style={{ color:"#9CA3AF" }}>|</span>
                            <span style={{ color:"#6B7280" }}>ช่วงมาตรฐาน: {r?`${Math.round(r.min)}–${Math.round(r.max)}`:"?"} kcal</span>
                          </div>
                          {log.note&&<div style={{ fontSize:11, color:"#9CA3AF", marginTop:4, fontStyle:"italic" }}>"{log.note}"</div>}
                          {log.photo&&<img src={log.photo} alt="" onClick={()=>setZoomPhoto(log.photo)} style={{ marginTop:8, width:56, height:56, objectFit:"cover", borderRadius:8, cursor:"zoom-in", border:"1px solid #FDE68A" }} />}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              );
            })()}

            {adminSection==="logs"&&(
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:8, background:spStatus==="connected"?"#F0FDF4":"#FEF2F2", border:`1px solid ${spStatus==="connected"?"#D1FAE5":"#FEE2E2"}`, borderRadius:13, padding:"10px 14px", marginBottom:12 }}>
                  <span>{spStatus==="connected"?"🟢":spStatus==="connecting"?"🟡":"🔴"}</span>
                  <div style={{ flex:1 }}>

                    <div style={{ fontSize:12, fontWeight:600, color:spStatus==="connected"?"#16A34A":"#DC2626" }}>{spStatus==="connected"?`Supabase ✓ sync ${spLastSync}`:spStatus==="connecting"?"กำลังเชื่อมต่อ...":"เชื่อมต่อไม่ได้"}</div>
                  </div>
                  <button className="v2-btn-teal" style={{ padding:"5px 12px", fontSize:11 }} onClick={()=>{ setSpStatus("connecting"); sbFetchLogs().then(d=>{ if(d.length>0)setLogs(d); setSpStatus("connected"); setSpLastSync(new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})); }).catch(()=>setSpStatus("error")); }}>🔄 Sync</button>
                </div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                  <div style={{ fontSize:11, color:"#9CA3AF" }}>{logs.length} รายการ</div>
                  <div style={{ display:"flex", gap:7 }}>
                    <button className="v2-btn-teal" onClick={exportCSV} style={{ padding:"6px 12px", fontSize:11 }}>⬇️ CSV</button>
                    <button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:"ประวัติทั้งหมด",fn:()=>{ setLogs([]); setDeleteConfirm(null); }})} style={{ padding:"6px 12px", fontSize:11 }}>🗑️ ล้าง</button>
                  </div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {logs.map(log=>{
                    const c=getGroupColor(log.group);
                    return (
                      <div key={log.id} style={{ background:"#FFFFFF", border:"1px solid #F3F4F6", borderRadius:12, padding:"9px 13px", display:"flex", alignItems:"center", gap:9 }}>
                        {log.photo&&<div className="v2-pthumb" onClick={()=>setZoomPhoto(log.photo)} style={{ width:36, height:36, flexShrink:0 }}><img src={log.photo} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", borderRadius:8 }} /></div>}
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:2 }}>
                            <span onClick={()=>{ setProfileUser(log.user); setProfileFilter("all"); setActiveTab("profile"); }} style={{ fontWeight:700, fontSize:12, cursor:"pointer", textDecoration:"underline dotted", color:"#111827" }}>{log.user}</span>
                            <span style={{ fontSize:9, background:c+"18", color:c, borderRadius:999, padding:"1px 6px", fontWeight:700 }}>{grpLabel(log.group)}</span>
                          </div>
                          <div style={{ color:"#9CA3AF", fontSize:10 }}>{log.exercise} · {log.duration}น. · {log.date}</div>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                          <div style={{ textAlign:"right" }}>
                            <div style={{ fontFamily:"'Prompt'", fontWeight:800, fontSize:14, color:c }}>{log.calories}</div>
                            <div style={{ fontSize:9, color:"#9CA3AF" }}>kcal</div>
                          </div>
                          {log.spId&&authUser?.role==="admin"&&<button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:`${log.user} - ${log.exercise}`,fn:async()=>{ await sbRemoveLog(log.id); setLogs(p=>p.filter(l=>l.id!==log.id)); setDeleteConfirm(null); }})} style={{ padding:"4px 9px", fontSize:11 }}>🗑️</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}

      </div>

      {/* Bottom Nav */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:50, background:"rgba(255,255,255,0.92)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", borderTop:"1px solid rgba(0,0,0,0.06)", paddingBottom:"env(safe-area-inset-bottom,0px)" }}>
        <div style={{ maxWidth:680, margin:"0 auto", display:"flex" }}>
          {tabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)} className={`v2-nav-btn ${activeTab===tab.id?"v2-nav-on":""}`}>
              <span style={{ fontSize:20 }}>{tab.icon}</span>
              <span>{tab.label}</span>
            </button>
          ))}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalorieTracker />);
  </script>
</body>
</html>
