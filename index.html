  <script>
  /* ── Auto-update detector — HEAD request only (0 bytes body) ── */
  (function(){
    let knownTag=null, bannerShown=false;

    const getTag = res => res.headers.get('etag') || res.headers.get('last-modified');

    const check = async () => {
      if(bannerShown) return;
      try {
        const res = await fetch(location.href, {method:'HEAD', cache:'no-store'});
        const tag = getTag(res);
        if(!tag) return;           // server ไม่ส่ง header — ข้ามไป
        if(knownTag === null){ knownTag = tag; return; }  // baseline ครั้งแรก
        if(tag !== knownTag) showBanner();
      } catch(e){}
    };

    const showBanner = () => {
      if(bannerShown) return;
      bannerShown = true;
      const b = document.createElement('div');
      b.id = 'update-banner';
      b.innerHTML =
        '<span>🔄 มีการอัปเดตใหม่</span>' +
        '<button id="upd-ok">รีเฟรชเลย</button>' +
        '<button id="upd-x">✕</button>';
      Object.assign(b.style, {
        position:'fixed', bottom:'72px', left:'50%', transform:'translateX(-50%)',
        zIndex:'9999', background:'#1E40AF', color:'#fff',
        padding:'10px 16px', borderRadius:'12px', fontSize:'13px',
        display:'flex', alignItems:'center', gap:'10px',
        boxShadow:'0 4px 20px rgba(0,0,0,0.3)',
        fontFamily:"'Prompt',sans-serif", whiteSpace:'nowrap'
      });
      document.body.appendChild(b);
      Object.assign(document.getElementById('upd-ok').style,
        {background:'#fff',color:'#1E40AF',border:'none',
         borderRadius:'6px',padding:'4px 12px',cursor:'pointer',
         fontSize:'12px',fontWeight:'700'});
      Object.assign(document.getElementById('upd-x').style,
        {background:'none',border:'none',color:'#93C5FD',
         cursor:'pointer',fontSize:'16px',lineHeight:'1'});
      document.getElementById('upd-ok').onclick = () => { const u=location.href.split('?')[0]+'?_t='+Date.now(); location.replace(u); };
      document.getElementById('upd-x').onclick  = () => b.remove();
    };

    window.addEventListener('load', check);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
    setInterval(() => { if(!document.hidden) check(); }, 10*60*1000); // ทุก 10 นาที
  })();
  </script>

// localStorage helpers
const lsGet = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(_e) { return fallback; } };
const lsSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(_e) {} };

// บีบอัดรูป — ย่อ pixel ไม่เกิน 1920px, quality เริ่มที่ 0.92, ไม่เกิน 500KB
const resizeImage = (file, maxPx = 1920, maxBytes = 500000) => new Promise(resolve => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(blobUrl);
    // ลด quality ซ้ำจนขนาด base64 ไม่เกิน maxBytes
    let q = 0.92;
    let b64 = c.toDataURL("image/jpeg", q);
    while (b64.length * 0.75 > maxBytes && q > 0.1) {
      q = Math.max(0.1, q - 0.05);
      b64 = c.toDataURL("image/jpeg", q);
    }
    resolve(b64);
  };
  img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(null); };
  img.src = blobUrl;
});

// --- เพิ่มฟังก์ชันแปลง Base64 และอัปโหลดไปยัง Storage ตรงนี้ ---
  const base64ToBlob = (base64Str) => {
    const parts = base64Str.split(';base64,');
    const contentType = parts[0].split(':')[1];
    const raw = window.atob(parts[1]);
    const rawLength = raw.length;
    const uInt8Array = new Uint8Array(rawLength);
    for (let i = 0; i < rawLength; ++i) {
      uInt8Array[i] = raw.charCodeAt(i);
    }
    return new Blob([uInt8Array], { type: contentType });
  };

  const uploadImageToStorage = async (base64Str, folder = 'logs') => {
    if (!base64Str) return null;
    try {
      const blob = base64ToBlob(base64Str);
      // เปลี่ยนจากโครงสร้าง folder/ ให้เป็นชื่อไฟล์แบนๆ ตรงๆ เพื่อให้เซฟลง Bucket ได้ชัวร์ๆ
      const fileName = `${folder}-${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;
      
      const { data, error } = await supabase.storage
        .from('exercise-photos')
        .upload(fileName, blob, {
          contentType: 'image/jpeg',
          upsert: true
        });

      if (error) throw error;

      const { data: { publicUrl } } = supabase.storage
        .from('exercise-photos')
        .getPublicUrl(fileName);

      return publicUrl;
    } catch (err) {
      console.error("Storage Upload Error:", err.message);
      return null;
    }
  };

const sbFetchLogs = async () => {
  const BATCH = 1000;
  let allData = [], from = 0;
  while (true) {
    const { data, error } = await supabase
      .from('exercise_logs')
      .select('id,employee_id,user_name,group_name,exercise,duration,calories,log_date,note,likes,verified,admin_comment')
      .order('log_date', { ascending: false })
      .order('created_at', { ascending: false })
      .range(from, from + BATCH - 1);
    if (error) throw new Error(error.message);
    if (!data || data.length === 0) break;
    allData = allData.concat(data);
    if (data.length < BATCH) break;
    from += BATCH;
  }
  const data = allData;
  return (data || []).map(i => ({
    id: i.id, spId: i.id,
    empId: i.employee_id || null,
    user: i.user_name || '', group: i.group_name || '',
    exercise: i.exercise || '', duration: Number(i.duration) || 0,
    calories: Number(i.calories) || 0, date: i.log_date || '',
    note: i.note || '', likes: Number(i.likes) || 0, hasPhoto: false,
    verified: i.verified || false,
    adminComment: i.admin_comment || '',
  }));
};

async function sbToggleLike(logId, empId) {
  const { data } = await supabase.from('log_likes').select('id').eq('log_id', logId).eq('employee_id', empId).maybeSingle();
  if (data) {
    await supabase.from('log_likes').delete().eq('log_id', logId).eq('employee_id', empId);
    return false; // unliked
  } else {
    await supabase.from('log_likes').insert({ log_id: logId, employee_id: empId });
    return true;  // liked
  }
}

// group_name อาจเก็บเป็น JSON string จากระบบเก่า เช่น '{"Value":"A : ..."}'
const cleanGroupName = (v) => {
  if (!v) return '';
  if (typeof v === 'string' && v.trim().startsWith('{')) {
    try { const p = JSON.parse(v); return (p?.Value || '').trim(); } catch {}
  }
  return v.trim();
};
const sbFetchUsersOnce = async () => {
  const { data, error } = await supabase.from('user_profiles').select('display_name,group_name,employee_id,photo,profile_icon,weekly_goal').limit(5000);
  if (error) return { allUsers: [], avatars: {} };
  const allUsers = (data||[]).map(u => ({ user: (u.display_name||'').trim(), group: cleanGroupName(u.group_name), empId: u.employee_id, profileIcon: u.profile_icon || null, weeklyGoal: u.weekly_goal ?? 5000 }));

  const days = [];

                        <div key={b.name} className="v2-badge" style={{ opacity:earned?1:0.3, filter:earned?"none":"grayscale(1)" }} title={b.desc}>

                        </div>

                  {/* Special Events */}
                  {SPECIAL_EVENTS.length > 0 && (
                    <div>
                      <div style={{ fontSize:11, fontWeight:700, color:"#7C3AED", marginBottom:8 }}>✨ Special Icons</div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                        {SPECIAL_EVENTS.map(e=>{
                          const earned = e.check(logs.filter(l=>l.user===profileUser));
                          return (
                            <div key={e.id} className="v2-badge" style={{ opacity:earned?1:0.3, filter:earned?"none":"grayscale(1)", border:earned?"1.5px solid #C4B5FD":"1.5px solid #E5E7EB", background:earned?"#F5F3FF":"#F9FAFB" }} title={e.desc}>
                              <span style={{ fontSize:18 }}>{e.icon}</span>
                              <div>
                                <div style={{ fontSize:11, fontWeight:700, color:earned?"#7C3AED":"#9CA3AF" }}>{e.name}</div>
                                <div style={{ fontSize:9.5, color:"#9CA3AF" }}>{e.desc}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  {/* Icon Picker — เฉพาะ profile ตัวเอง */}
                  {profileUser===authUser?.displayName && (()=>{
                    const uLogs = logs.filter(l=>l.user===profileUser);
                    const uTotalCal = uLogs.reduce((s,l)=>s+l.calories,0);
                    const unlocked = getAllUnlockedIcons(uTotalCal, uLogs.length, uLogs, authUser?.role==="admin");
                    const current = profileIconMap[profileUser] || null;
                    if (!unlocked.length) return null;
                    const handlePickIcon = async (icon) => {
                      const next = icon === current ? null : icon;
                      setProfileIconMap(prev => { const m={...prev}; if(next) m[profileUser]=next; else delete m[profileUser]; lsSet("tvohh_profileicons",m); return m; });
                      try { await sbUpdateProfileIcon(authUser.empId, next); }
                      catch(e) { console.warn("icon save failed:", e.message); }
                    };
                    return (
                      <div style={{ marginTop:14, borderTop:"1px solid #F3F4F6", paddingTop:12 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:"#374151", marginBottom:8 }}>🎨 เลือก Icon แสดงข้างชื่อ</div>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:8, alignItems:"center" }}>
                          {/* ไม่ใช้ */}
                          <div onClick={()=>handlePickIcon(null)}
                            style={{ width:40, height:40, borderRadius:12, border:!current?"2.5px solid #16A34A":"1.5px solid #E5E7EB", background:!current?"#DCFCE7":"#F9FAFB", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", fontSize:11, color:"#9CA3AF", fontWeight:700 }}>
                            ไม่ใช้
                          </div>
                          {unlocked.map(u=>(
                            <div key={u.icon} onClick={()=>handlePickIcon(u.icon)} title={u.name}
                              style={{ width:40, height:40, borderRadius:12, border:current===u.icon?"2.5px solid #7C3AED":"1.5px solid #E5E7EB", background:current===u.icon?"#F5F3FF":"#F9FAFB", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, cursor:"pointer", transition:"all .15s", boxShadow:current===u.icon?"0 0 0 3px #C4B5FD55":"none" }}>
                              {u.icon}
                            </div>
                          ))}
                        </div>
                        {current && <div style={{ fontSize:10, color:"#9CA3AF", marginTop:6 }}>กำลังใช้: {current} — กดซ้ำเพื่อยกเลิก</div>}
                      </div>
                    );
                  })()}
                </div>

                {/* ── Exercise Analysis 30d ── */}
                {(()=>{
                  const cutoff30 = new Date(); cutoff30.setDate(cutoff30.getDate()-30);
                  const cutoff30s = thaiDate(cutoff30);
                  const r30 = allProfileLogs.filter(l=>l.date>=cutoff30s);
                  if (!r30.length) return null;

                  // === Metrics ===
                  const activeDays = new Set(r30.map(l=>l.date)).size;
                  const exCnt = {}; r30.forEach(l=>{exCnt[l.exercise]=(exCnt[l.exercise]||0)+1;});
                  const topExArr = Object.entries(exCnt).sort((a,b)=>b[1]-a[1]);
                  const topEx = topExArr[0]?.[0]||"-";
                  const exTypes = topExArr.length;
                  const dowCnt = [0,0,0,0,0,0,0];
                  r30.forEach(l=>{const d=new Date(l.date);dowCnt[d.getDay()]++;});
                  const dowTH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
                  const dowFull = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
                  const bestDowIdx = dowCnt.indexOf(Math.max(...dowCnt));
                  const totalMin = r30.reduce((s,l)=>s+l.duration,0);
                  const avgMin = r30.length ? Math.round(totalMin/r30.length) : 0;
                  const actDaySet = new Set(allProfileLogs.map(l=>l.date));
                  let streak=0; const todayS=thaiDate();
                  let sMs2=actDaySet.has(todayS)?Date.now():Date.now()-86400000;
                  for(let i=0;i<365;i++){const ds=thaiDate(new Date(sMs2-i*86400000));if(actDaySet.has(ds))streak++;else break;}
                  const totalLikes=allProfileLogs.reduce((s,l)=>s+(l.likes||0),0);
                  const cut15s=thaiDate(new Date(Date.now()-15*86400000));
                  const prev15=r30.filter(l=>l.date<cut15s).length;
                  const last15=r30.filter(l=>l.date>=cut15s).length;
                  const trend=last15-prev15;
                  const pct=Math.round((activeDays/30)*100);
                  const rating=activeDays>=22?{t:"ยอดเยี่ยม",emoji:"🔥",c:"#DC2626"}
                    :activeDays>=15?{t:"ดีมาก",emoji:"⭐",c:"#16A34A"}
                    :activeDays>=8?{t:"ดี",emoji:"👍",c:"#0891B2"}
                    :activeDays>=3?{t:"พอใช้",emoji:"📝",c:"#D97706"}
                    :{t:"ควรเพิ่ม",emoji:"💪",c:"#9CA3AF"};

                  // === Donut via SVG path arcs (reliable, no circumference math) ===
                  const ECOLS=['#16A34A','#0891B2','#7C3AED','#D97706','#DC2626','#9CA3AF'];
                  const DCOLS=['#7C3AED','#0891B2','#16A34A','#D97706','#DC2626','#9CA3AF','#EC4899'];

                  // Convert angle (deg, 0=top, CW) → SVG coordinate
                  const polar=(cx,cy,r,deg)=>{
                    const rad=(deg-90)*Math.PI/180;
                    return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
                  };

                  // Build arc path for a donut slice
                  const arcPath=(cx,cy,r,startDeg,endDeg)=>{
                    const [x1,y1]=polar(cx,cy,r,startDeg);
                    const [x2,y2]=polar(cx,cy,r,endDeg);
                    const large=endDeg-startDeg>180?1:0;
                    return `M ${x1.toFixed(3)} ${y1.toFixed(3)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)}`;
                  };

                  const DonutChart=({slices,cols,size=100,centerVal,centerLabel})=>{
                    const cx=50,cy=50,r=37,thick=13;
                    // compute cumulative angles from raw values (avoids float drift)
                    const total=slices.reduce((s,sl)=>s+sl.val,0)||1;
                    let cumDeg=0;
                    const arcs=slices.map((sl,i)=>{
                      const deg=(sl.val/total)*360;
                      const start=cumDeg; cumDeg+=deg;
                      return{start,end:cumDeg,col:cols[i%cols.length],sl};
                    });
                    // force last arc to close perfectly
                    if(arcs.length) arcs[arcs.length-1].end=360;

                    return (
                      <div style={{position:"relative",width:size,height:size,margin:"0 auto",flexShrink:0}}>
                        <svg viewBox="0 0 100 100" style={{width:size,height:size,display:"block"}}>
                          {/* background ring */}
                          <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E5E7EB" strokeWidth={thick}/>
                          {arcs.map((arc,i)=>{
                            const span=arc.end-arc.start;
                            if(span<0.1) return null;
                            // full circle: split into two 180° arcs to avoid degenerate arc
                            if(span>=359.9){
                              return (
                                <g key={i}>
                                  <path d={arcPath(cx,cy,r,0,180)} fill="none" stroke={arc.col} strokeWidth={thick} strokeLinecap="butt"/>
                                  <path d={arcPath(cx,cy,r,180,360)} fill="none" stroke={arc.col} strokeWidth={thick} strokeLinecap="butt"/>
                                </g>
                              );
                            }
                            return (
                              <path key={i}
                                d={arcPath(cx,cy,r,arc.start,arc.end)}
                                fill="none" stroke={arc.col}
                                strokeWidth={thick} strokeLinecap="butt"/>
                            );
                          })}
                        </svg>
                        {centerVal&&(
                          <div style={{position:"absolute",top:"50%",left:"50%",
                            transform:"translate(-50%,-50%)",textAlign:"center",
                            pointerEvents:"none",width:"52%",lineHeight:1}}>
                            <div style={{fontSize:Math.round(size*0.16),fontWeight:800,color:"#1F2937"}}>{centerVal}</div>
                            {centerLabel&&<div style={{fontSize:Math.round(size*0.09),color:"#9CA3AF",marginTop:2,whiteSpace:"nowrap"}}>{centerLabel}</div>}
                          </div>
                        )}
                      </div>
                    );
                  };

                  // Legend 2-col
                  const Legend=({slices,cols})=>(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 6px",marginTop:10,width:"100%"}}>
                      {slices.map((sl,i)=>{
                        const total2=slices.reduce((s,x)=>s+x.val,0)||1;
                        return (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                            <div style={{width:8,height:8,borderRadius:2,background:cols[i%cols.length],flexShrink:0}}/>
                            <span style={{fontSize:9.5,color:"#374151",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{sl.name}</span>
                            <span style={{fontSize:9.5,fontWeight:700,color:cols[i%cols.length],flexShrink:0}}>{Math.round((sl.val/total2)*100)}%</span>
                          </div>
                        );
                      })}
                    </div>
                  );

                  // === Prepare slices ===
                  // Exercise type: top5 + อื่นๆ
                  const ex5=topExArr.slice(0,5);
                  const exOtherVal=r30.length-ex5.reduce((s,[,v])=>s+v,0);
                  const exSlices=[...ex5.map(([n,v])=>({name:n,val:v})),
                    ...(exOtherVal>0?[{name:"อื่นๆ",val:exOtherVal}]:[])];

                  // DOW: all active days
                  const dowSlices=dowTH.map((d,i)=>({name:d,val:dowCnt[i]}))
                    .filter(s=>s.val>0).sort((a,b)=>b.val-a.val);

                  // === Weekly bars ===
                  const weekData=[3,2,1,0].map(w=>{
                    const eMs=Date.now()-w*7*86400000; const sMsW=Date.now()-(w+1)*7*86400000;
                    const sS=thaiDate(new Date(sMsW)); const eS=thaiDate(new Date(eMs));
                    const wLogs=allProfileLogs.filter(l=>l.date>=sS&&l.date<=eS);
                    return{mins:wLogs.reduce((s,l)=>s+l.duration,0),
                      label:w===0?"สัปดาห์นี้":`-${w+1} สปด`,isNow:w===0};
                  });
                  const weekMax=Math.max(...weekData.map(d=>d.mins),1);

                  // === Anomaly detection ===
                  const anomalies=[];
                  const longSess=r30.filter(l=>l.duration>120);
                  if(longSess.length>0){
                    const det=longSess.slice(0,3).map(l=>`${l.date} — ${l.exercise} (${l.duration} นาที)`).join(' / ');
                    anomalies.push({lvl:'warn',msg:`พบ ${longSess.length} ครั้งออกนานผิดปกติ >120 นาที`,det});
                  }
                  const dayCnt2={}; r30.forEach(l=>{dayCnt2[l.date]=(dayCnt2[l.date]||0)+1;});
                  const busyDays=Object.entries(dayCnt2).filter(([,c])=>c>3).sort((a,b)=>b[1]-a[1]);
                  if(busyDays.length>0){
                    const det=busyDays.slice(0,3).map(([d,c])=>`${d} (${c} ครั้ง)`).join(' / ');
                    anomalies.push({lvl:'warn',msg:`บันทึก >3 ครั้ง/วัน ใน ${busyDays.length} วัน อาจกดซ้ำ`,det});
                  }
                  const suspCal=r30.filter(l=>l.duration>0&&l.calories>0&&(l.calories/l.duration>25||l.calories/l.duration<1));
                  if(suspCal.length>0){
                    const det=suspCal.slice(0,2).map(l=>`${l.date} ${l.exercise}: ${l.calories}kcal/${l.duration}นาที (${(l.calories/l.duration).toFixed(1)}kcal/นาที)`).join(' / ');
                    anomalies.push({lvl:'warn',msg:`แคลอรี่ผิดสัดส่วน ${suspCal.length} รายการ (ควร 3–20 kcal/นาที)`,det});
                  }
                  const dupMap={}; r30.forEach(l=>{const k=`${l.date}|${l.exercise}|${l.duration}`;(dupMap[k]=dupMap[k]||[]).push(l);});
                  const dups=Object.entries(dupMap).filter(([,a])=>a.length>1);
                  if(dups.length>0){
                    const det=dups.slice(0,2).map(([k,a])=>{const[d,e,m]=k.split('|');return `${d} ${e} ${m}นาที (×${a.length})`;}).join(' / ');
                    anomalies.push({lvl:'error',msg:`พบรายการซ้ำกัน ${dups.length} รายการ`,det});
                  }
                  const last7s=thaiDate(new Date(Date.now()-7*86400000));
                  const recentLogs=r30.filter(l=>l.date>=last7s);
                  const prevLogs=r30.filter(l=>l.date<last7s);
                  if(recentLogs.length===0&&prevLogs.length>=5){
                    const le=prevLogs[0];
                    anomalies.push({lvl:'info',msg:`7 วันล่าสุดไม่มีการบันทึกเลย`,det:`บันทึกล่าสุด: ${le?.date} — ${le?.exercise} (${le?.duration} นาที)`});
                  }
                  const zeroDur=r30.filter(l=>!l.duration||l.duration===0);
                  if(zeroDur.length>0){
                    const det=zeroDur.slice(0,3).map(l=>`${l.date} ${l.exercise}`).join(' / ');
                    anomalies.push({lvl:'warn',msg:`${zeroDur.length} รายการไม่ได้กรอกเวลา (0 นาที)`,det});
                  }
                  const shortSess=r30.filter(l=>l.duration>0&&l.duration<5&&l.calories>0);
                  if(shortSess.length>0){
                    const det=shortSess.slice(0,2).map(l=>`${l.date} ${l.exercise} (${l.duration}นาที ${l.calories}kcal)`).join(' / ');
                    anomalies.push({lvl:'info',msg:`${shortSess.length} รายการออกน้อยกว่า 5 นาที`,det});
                  }

                  const lvlStyle={
                    error:{bg:"#FEE2E2",border:"#FECACA",text:"#991B1B",icon:"❌"},
                    warn:{bg:"#FEF3C7",border:"#FDE68A",text:"#92400E",icon:"⚠️"},
                    info:{bg:"#EFF6FF",border:"#BFDBFE",text:"#1E40AF",icon:"ℹ️"},
                  };

                  // Tips
                  const tips=[];
                  if(activeDays<8) tips.push("💡 ลองตั้งเป้าออกกำลังกาย 3 วัน/สัปดาห์ก่อน");
                  else if(activeDays<15) tips.push("💡 ออกสม่ำเสมอดีแล้ว ลองเพิ่มเป็น 4-5 วัน/สัปดาห์");
                  if(avgMin<20) tips.push("💡 เพิ่มเวลาเป็น 30 นาที/ครั้ง ตาม WHO guideline");
                  if(exTypes===1) tips.push(`💡 ออกแต่ ${topEx} ลองเพิ่มความหลากหลาย`);
                  if(trend>3) tips.push(`💡 แนวโน้มดีขึ้น +${trend} ครั้งใน 2 สัปดาห์หลัง 🎉`);
                  else if(trend<-3) tips.push(`💡 2 สัปดาห์หลังลดลง ${Math.abs(trend)} ครั้ง ลองหา challenge ใหม่`);
                  if(streak>=7) tips.push(`💡 streak ${streak} วัน! อย่าลืมพักฟื้นด้วย`);
                  if(!tips.length) tips.push("💡 ดีมาก! รักษาความสม่ำเสมอและฟังสัญญาณร่างกาย");

                  return (
                    <div className="v2-card" style={{padding:18,marginBottom:14}}>

                      {/* Header */}
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                        <div style={{fontFamily:"'Prompt'",fontWeight:700,fontSize:13,color:"#374151"}}>📊 วิเคราะห์ 30 วันล่าสุด</div>
                        <div style={{display:"flex",alignItems:"center",gap:6,background:rating.c+"18",border:`1px solid ${rating.c}44`,borderRadius:20,padding:"3px 12px"}}>
                          <span style={{fontSize:14}}>{rating.emoji}</span>
                          <span style={{fontSize:11,fontWeight:700,color:rating.c}}>{rating.t}</span>
                        </div>
                      </div>

                      {/* KPI row */}
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
                        {[
                          {val:`${activeDays}`,unit:"วัน",label:"ออกกำลังกาย/30วัน",c:"#16A34A"},
                          {val:`${avgMin}`,unit:"นาที",label:"เฉลี่ย/ครั้ง",c:"#0891B2"},
                          {val:`${streak}`,unit:"วัน",label:"streak ต่อเนื่อง",c:"#7C3AED"},
                        ].map((k,i)=>(
                          <div key={i} style={{background:"#F9FAFB",borderRadius:10,padding:"10px 6px",textAlign:"center",border:`1px solid ${k.c}22`}}>
                            <div style={{fontSize:20,fontWeight:800,color:k.c,lineHeight:1}}>{k.val}<span style={{fontSize:9.5,fontWeight:400,color:"#9CA3AF"}}> {k.unit}</span></div>
                            <div style={{fontSize:9,color:"#6B7280",marginTop:3}}>{k.label}</div>
                          </div>
                        ))}
                      </div>

                      {/* Donut Charts 2-col */}
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                        <div style={{background:"#F9FAFB",borderRadius:12,padding:"14px 12px",display:"flex",flexDirection:"column",alignItems:"center"}}>
                          <div style={{fontSize:10.5,fontWeight:700,color:"#6B7280",marginBottom:10,alignSelf:"flex-start"}}>🏋️ สัดส่วนกิจกรรม</div>
                          <DonutChart slices={exSlices} cols={ECOLS} size={104}
                            centerVal={`${exTypes}`} centerLabel="ประเภท"/>
                          <Legend slices={exSlices} cols={ECOLS}/>
                        </div>
                        <div style={{background:"#F9FAFB",borderRadius:12,padding:"14px 12px",display:"flex",flexDirection:"column",alignItems:"center"}}>
                          <div style={{fontSize:10.5,fontWeight:700,color:"#6B7280",marginBottom:10,alignSelf:"flex-start"}}>📅 วันที่ออกบ่อย</div>
                          <DonutChart slices={dowSlices} cols={DCOLS} size={104}
                            centerVal={`วัน${dowTH[bestDowIdx]}`} centerLabel="บ่อยสุด"/>
                          <Legend slices={dowSlices} cols={DCOLS}/>
                        </div>
                      </div>

                      {/* Weekly bar */}
                      <div style={{background:"#F9FAFB",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                        <div style={{fontSize:10.5,fontWeight:700,color:"#6B7280",marginBottom:10}}>📈 แนวโน้มรายสัปดาห์</div>
                        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:64}}>
                          {weekData.map((d,i)=>(
                            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,height:"100%"}}>
                              <div style={{flex:1,width:"100%",display:"flex",alignItems:"flex-end"}}>
                                <div style={{width:"100%",height:`${Math.max(4,(d.mins/weekMax)*100)}%`,
                                  background:d.isNow?"linear-gradient(180deg,#16A34A,#4ADE80)":"#D1FAE5",
                                  borderRadius:"5px 5px 0 0",
                                  boxShadow:d.isNow?"0 -2px 6px #16A34A44":"none"}}/>
                              </div>
                              {d.mins>0&&<div style={{fontSize:8,color:d.isNow?"#16A34A":"#9CA3AF",fontWeight:700}}>{d.mins}น.</div>}
                              <div style={{fontSize:8.5,color:d.isNow?"#16A34A":"#9CA3AF",fontWeight:d.isNow?700:400,textAlign:"center",lineHeight:1.2}}>{d.label}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Anomaly */}
                      {anomalies.length>0&&(
                        <div style={{marginBottom:12}}>
                          <div style={{fontSize:10.5,fontWeight:700,color:"#374151",marginBottom:6}}>🔍 สรุปผลการออกกำลังกาย</div>
                          {anomalies.map((a,i)=>{
                            const s=lvlStyle[a.lvl];
                            return (
                              <div key={i} style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:9,padding:"7px 10px",marginBottom:5}}>
                                <div style={{fontSize:11,fontWeight:600,color:s.text,lineHeight:1.5}}>{s.icon} {a.msg}</div>
                                {a.det&&<div style={{fontSize:9.5,color:s.text,opacity:0.8,marginTop:3,lineHeight:1.5,fontStyle:"italic"}}>{a.det}</div>}
                              </div>
                            );
                          })}
                        </div>
                      )}
                      {anomalies.length===0&&(
                        <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:9,padding:"7px 10px",marginBottom:12,fontSize:11,color:"#166534"}}>
                          ✅ ไม่พบข้อมูลผิดปกติใน 30 วันที่ผ่านมา
                        </div>
                      )}

                      {/* Tips */}

                                    <div style={{ fontSize:10, color:"#9CA3AF" }}>kcal</div>
                                  </div>
                                </div>

            </div>
            <div className="tab-scroll" style={{ marginBottom:16 }}>
              {[{id:"exercises",label:"🏋️ กีฬา"},{id:"groups",label:"👥 กลุ่ม"},{id:"logs",label:"📋 ประวัติ"},{id:"anomaly",label:"🔍 ตรวจสอบ"}].map(s=>(
                <button key={s.id} onClick={()=>setAdminSection(s.id)} className={`v2-pill ${adminSection===s.id?"v2-pill-on":""}`}>{s.label}</button>
              ))}
            </div>

            {adminSection==="exercises"&&(
              <div>
                <div className="v2-adm-card" style={{ padding:18, marginBottom:14 }}>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, color:"#16A34A", marginBottom:13, fontSize:14 }}>{editingEx!==null?"✏️ แก้ไขประเภทกีฬา":"➕ เพิ่มประเภทกีฬา"}</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:11, marginBottom:11 }}>
                    <div><label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:5, fontWeight:700 }}>ชื่อกีฬา</label><input value={exForm.name} onChange={e=>setExForm(p=>({...p,name:e.target.value}))} placeholder="เช่น วิ่ง" style={{ width:"100%", padding:"10px 12px", borderRadius:11, fontSize:13 }} /></div>
                    <div><label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:5, fontWeight:700 }}>kcal/นาที</label><input type="number" min={1} max={30} value={exForm.calPerMin} onChange={e=>setExForm(p=>({...p,calPerMin:+e.target.value}))} style={{ width:"100%", padding:"10px 12px", borderRadius:11, fontSize:13 }} /></div>
                  </div>
                  <div style={{ marginBottom:11 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:6, fontWeight:700 }}>ไอคอน</label>
                    <div style={{ display:"flex", gap:9, alignItems:"center" }}>
                      <div style={{ width:42, height:42, borderRadius:11, background:"#F0FDF4", border:"1px solid #D1FAE5", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>{exForm.icon}</div>
                      <button className="v2-btn-ghost" onClick={()=>setShowEmojiPicker(p=>!p)} style={{ padding:"8px 13px", fontSize:12 }}>เลือก {showEmojiPicker?"▲":"▼"}</button>
                    </div>
                    {showEmojiPicker&&(
                      <div style={{ marginTop:8, background:"#FFFFFF", border:"1px solid #E5E7EB", borderRadius:13, padding:11 }}>
                        <div style={{ display:"grid", gridTemplateColumns:"repeat(6,1fr)", gap:6, maxHeight:170, overflowY:"auto" }}>
                          {COMMON_EMOJIS.map(em=><button key={em} onClick={()=>{ setExForm(p=>({...p,icon:em})); setShowEmojiPicker(false); }} style={{ background:"#F0FDF4", border:"1px solid #E5E7EB", borderRadius:9, cursor:"pointer", padding:7, fontSize:19, transition:"all .15s" }}>{em}</button>)}
                        </div>
                      </div>
                    )}
                  </div>
                  <div style={{ marginBottom:13 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:6, fontWeight:700 }}>🖼️ รูปภาพ</label>
                    <div style={{ display:"flex", gap:9, alignItems:"center" }}>
                      {exForm.image&&<div style={{ width:50, height:50, borderRadius:11, overflow:"hidden" }}><img src={exForm.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /></div>}
                      <div className="v2-upload" onClick={()=>exImgRef.current?.click()} style={{ flex:1, padding:"12px 7px" }}>
                        <div style={{ fontSize:18, marginBottom:3 }}>📷</div><div style={{ fontSize:10.5, color:"#9CA3AF" }}>อัพโหลดรูป</div>
                      </div>
                      <input ref={exImgRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e=>handleImgUpload(e.target.files[0],setExForm)} />
                    </div>
                    {exForm.image&&<button className="v2-btn-ghost" onClick={()=>setExForm(p=>({...p,image:null}))} style={{ fontSize:11, padding:"3px 9px", marginTop:6 }}>✕ ลบรูป</button>}
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button className="v2-btn-primary" onClick={handleSaveEx} style={{ flex:1, padding:11, fontSize:13 }}>{editingEx!==null?"💾 บันทึก":"➕ เพิ่ม"}</button>
                    {editingEx!==null&&<button className="v2-btn-ghost" onClick={()=>{ setEditingEx(null); setExForm({name:"",icon:"🏃",calPerMin:5,image:null}); setShowEmojiPicker(false); }} style={{ padding:"11px 13px", fontSize:12 }}>ยกเลิก</button>}
                  </div>
                </div>
                <div style={{ fontSize:11, color:"#9CA3AF", marginBottom:8 }}>{exercises.length} ประเภท</div>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {exercises.map(ex=>(
                    <div key={ex.id} className="v2-card" style={{ padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:38, height:38, borderRadius:11, overflow:"hidden", background:"#F0FDF4", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                        {ex.image?<img src={ex.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />:<span style={{ fontSize:18 }}>{ex.icon}</span>}
                      </div>
                      <div style={{ flex:1 }}><div style={{ fontWeight:700, fontFamily:"'Prompt'", fontSize:13 }}>{ex.name}</div><div style={{ fontSize:10, color:"#9CA3AF" }}>{ex.calPerMin} kcal/นาที</div></div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button className="v2-btn-ghost" onClick={()=>handleEditEx(ex)} style={{ padding:"5px 10px", fontSize:12 }}>✏️</button>
                        <button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:ex.name,fn:()=>{ setExercises(p=>p.filter(e=>e.id!==ex.id)); setDeleteConfirm(null); }})} style={{ padding:"5px 10px", fontSize:12 }}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {adminSection==="groups"&&(
              <div>
                <div className="v2-adm-card" style={{ padding:18, marginBottom:14 }}>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, color:"#16A34A", marginBottom:13, fontSize:14 }}>{editingGrp!==null?"✏️ แก้ไขกลุ่ม":"➕ เพิ่มกลุ่มใหม่"}</div>
                  <div style={{ marginBottom:11 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:5, fontWeight:700 }}>ชื่อกลุ่ม</label>
                    <input value={grpForm.name} onChange={e=>setGrpForm(p=>({...p,name:e.target.value}))} placeholder="เช่น E : ทีมใหม่" style={{ width:"100%", padding:"10px 12px", borderRadius:11, fontSize:13 }} />
                  </div>
                  <div style={{ marginBottom:11 }}>
                    <label style={{ fontSize:10.5, color:"#374151", display:"block", marginBottom:6, fontWeight:700 }}>สีประจำกลุ่ม</label>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:9 }}>
                      {PALETTE.map(c=><button key={c} onClick={()=>setGrpForm(p=>({...p,color:c}))} style={{ width:28, height:28, borderRadius:7, background:c, border:grpForm.color===c?"3px solid #fff":"2px solid transparent", cursor:"pointer", boxShadow:grpForm.color===c?`0 0 0 2px ${c}`:"none", transition:"all .15s" }} />)}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                      <div style={{ width:32, height:32, borderRadius:9, background:grpForm.color, flexShrink:0 }} />
                      <input value={grpForm.color} onChange={e=>setGrpForm(p=>({...p,color:e.target.value}))} style={{ padding:"7px 11px", borderRadius:9, fontSize:12, width:100 }} />
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button className="v2-btn-primary" onClick={handleSaveGrp} style={{ flex:1, padding:11, fontSize:13 }}>{editingGrp!==null?"💾 บันทึก":"➕ เพิ่มกลุ่ม"}</button>
                    {editingGrp!==null&&<button className="v2-btn-ghost" onClick={()=>{ setEditingGrp(null); setGrpForm({name:"",color:"#16A34A",image:null}); }} style={{ padding:"11px 13px", fontSize:12 }}>ยกเลิก</button>}
                  </div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {groups.map(g=>(
                    <div key={g.id} className="v2-card" style={{ padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:38, height:38, borderRadius:11, background:g.color+"22", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, border:`1.5px solid ${g.color}33` }}>
                        <span style={{ fontSize:18, color:g.color }}>👥</span>
                      </div>
                      <div style={{ flex:1 }}><div style={{ fontWeight:700, fontFamily:"'Prompt'", fontSize:13, color:g.color }}>{g.name}</div><div style={{ display:"flex", alignItems:"center", gap:5, marginTop:2 }}><div style={{ width:10, height:10, borderRadius:3, background:g.color }} /><span style={{ fontSize:10, color:"#9CA3AF" }}>{g.color}</span></div></div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button className="v2-btn-ghost" onClick={()=>handleEditGrp(g)} style={{ padding:"5px 10px", fontSize:12 }}>✏️</button>
                        <button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:g.name,fn:()=>{ setGroups(p=>p.filter(x=>x.id!==g.id)); setDeleteConfirm(null); }})} style={{ padding:"5px 10px", fontSize:12 }}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {adminSection==="logs"&&(
              <div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
                  <div style={{ fontSize:12, color:"#9CA3AF" }}>{logs.length} รายการทั้งหมด · ยังไม่ตรวจสอบ {logs.filter(l=>!l.verified).length} รายการ</div>
                  <button className="v2-btn-teal" onClick={exportCSV} style={{ padding:"5px 12px", fontSize:11 }}>📥 Export CSV</button>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {[...logs].sort((a,b)=>{
                    if(!a.verified && b.verified) return -1;
                    if(a.verified && !b.verified) return 1;
                    return b.date>a.date?1:b.date<a.date?-1:0;
                  }).map(log=>{
                    const c=getGroupColor(log.group);
                    return (
                      <div key={log.id} style={{ background:"#FFFFFF", border:`1.5px solid ${log.verified?"#BBF7D0":"#F3F4F6"}`, borderRadius:12, padding:"12px 14px" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                          {profileIconMap[log.user]&&<span style={{ fontSize:12 }}>{profileIconMap[log.user]}</span>}
                          <span style={{ fontWeight:700, fontSize:13, color:"#111827" }}>{log.user}</span>
                          <span style={{ fontSize:9, background:c+"18", color:c, borderRadius:999, padding:"1px 7px", fontWeight:700 }}>{grpLabel(log.group)}</span>
                          <span style={{ marginLeft:"auto", fontSize:11, color:"#6B7280" }}>{log.date}</span>
                        </div>
                        <div style={{ fontSize:12, color:"#6B7280", marginBottom:8 }}>{log.exercise} · {log.duration} นาที · {log.calories} kcal</div>
                        <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                          <button onClick={()=>handleVerify(log.id)}
                            style={{ background:log.verified?"#DCFCE7":"#F3F4F6", border:log.verified?"1.5px solid #22C55E":"1.5px solid #D1D5DB", borderRadius:8, padding:"3px 10px", fontSize:11, cursor:"pointer", fontWeight:700, color:log.verified?"#16A34A":"#6B7280" }}>
                            {log.verified?"✅ ตรวจสอบแล้ว":"⬜ รอตรวจสอบ"}
                          </button>
                          <div style={{ flex:1, display:"flex", gap:6, alignItems:"center" }}>
                            <input
                              value={commentDrafts[log.id]!==undefined?commentDrafts[log.id]:(log.adminComment||'')}
                              onChange={e=>setCommentDrafts(p=>({...p,[log.id]:e.target.value}))}
                              placeholder="💬 Comment ถึง user..."
                              style={{ flex:1, fontSize:11, padding:"4px 8px", borderRadius:8, border:"1px solid #FDE047", background:"#FFFBEB", outline:"none", fontFamily:"inherit" }}
                            />
                            {(commentDrafts[log.id]!==undefined?commentDrafts[log.id]:(log.adminComment||''))!==(log.adminComment||'')&&(
                              <button onClick={()=>handleSaveComment(log.id)} style={{ fontSize:11, padding:"4px 10px", borderRadius:8, background:"#F59E0B", color:"#fff", border:"none", cursor:"pointer", fontWeight:700, flexShrink:0 }}>บันทึก</button>
                            )}
                          </div>
                          {log.spId&&<button className="v2-btn-danger" onClick={()=>setDeleteConfirm({name:`${log.user} - ${log.exercise}`,fn:async()=>{ await sbRemoveLog(log.id); setLogs(p=>p.filter(l=>l.id!==log.id)); setDeleteConfirm(null); }})} style={{ padding:"4px 9px", fontSize:11 }}>🗑️</button>}
                        </div>
                      </div>
                    );
                  })}
                  {logs.length===0&&<div style={{ textAlign:"center", padding:40, color:"#9CA3AF", fontSize:13 }}>ยังไม่มีข้อมูล</div>}
                </div>
              </div>
            )}

            {adminSection==="anomaly"&&(()=>{
              const anomalyLogs = logs.filter(l => isCalAnomaly(l.exercise, l.duration, l.calories));
              return (
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                  <div style={{ fontFamily:"'Prompt'", fontWeight:700, fontSize:14, color:"#D97706" }}>🔍 แคลอรี่ผิดปกติ</div>
                  <div style={{ background:"#FEF3C7", border:"1px solid #FDE68A", borderRadius:8, padding:"3px 10px", fontSize:12, color:"#92400E", fontWeight:700 }}>{anomalyLogs.length} รายการ</div>
                </div>
                {anomalyLogs.length===0?(
                  <div style={{ textAlign:"center", color:"#9CA3AF", padding:"30px 0", fontSize:13 }}>ไม่พบรายการผิดปกติ ✅</div>
                ):(
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                    {anomalyLogs.map(l=>{
                      const range=calcCalRange(l.exercise,l.duration);
                      const color=getGroupColor(currentGroup(l));
                      return(
                        <div key={l.id} className="v2-card" style={{ padding:"12px 14px", borderLeft:"3px solid #F59E0B" }}>
                          <div style={{ display:"flex", justifyContent:"spaceBeween", alignItems:"center", marginBottom:4 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                              <span style={{ fontWeight:700, fontSize:13 }}>{profileIconMap[l.user]&&<span style={{ marginRight:2 }}>{profileIconMap[l.user]}</span>}{l.user}</span>
                              <span style={{ fontSize:10, background:color+"18", color, borderRadius:999, padding:"1px 7px", fontWeight:700 }}>{grpLabel(currentGroup(l))}</span>
                            </div>
                            <span style={{ fontSize:11, color:"#6B7280" }}>{l.date}</span>
                          </div>
                          <div style={{ fontSize:12, color:"#6B7280" }}>
                            {l.exercise} · {l.duration} นาที · <strong style={{ color:"#D97706" }}>{l.calories} kcal</strong>
                            {range&&<span style={{ color:"#9CA3AF", marginLeft:6 }}>(ปกติ {range.min}–{range.max})</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              );
            })()}

          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:50, background:"rgba(255,255,255,0.92)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", borderTop:"1px solid rgba(0,0,0,0.06)", paddingBottom:"env(safe-area-inset-bottom,0px)" }}>
        <div style={{ maxWidth:680, margin:"0 auto", display:"flex", overflowX:"auto" }}>
          {tabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
              className={`v2-nav-btn${activeTab===tab.id?" v2-nav-on":""}`}>
              <span style={{ fontSize:20 }}>{tab.icon}</span>
              <span>{tab.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalorieTracker />);
  </script>
</body>
</html>
