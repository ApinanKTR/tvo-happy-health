  <script>
  /* ── Auto-update detector — HEAD request only (0 bytes body) ── */
  (function(){
    let knownTag=null, bannerShown=false;

    const getTag = res => res.headers.get('etag') || res.headers.get('last-modified');

    const check = async () => {
      if(bannerShown) return;
      try {
        const res = await fetch(location.href, {method:'HEAD', cache:'no-store'});
        const tag = getTag(res);
        if(!tag) return;           // server ไม่ส่ง header — ข้ามไป
        if(knownTag === null){ knownTag = tag; return; }  // baseline ครั้งแรก
        if(tag !== knownTag) showBanner();
      } catch(e){}
    };

    const showBanner = () => {
      if(bannerShown) return;
      bannerShown = true;
      const b = document.createElement('div');
      b.id = 'update-banner';
      b.innerHTML =
        '<span>🔄 มีการอัปเดตใหม่</span>' +
        '<button id="upd-ok">รีเฟรชเลย</button>' +
        '<button id="upd-x">✕</button>';
      Object.assign(b.style, {
        position:'fixed', bottom:'72px', left:'50%', transform:'translateX(-50%)',
        zIndex:'9999', background:'#1E40AF', color:'#fff',
        padding:'10px 16px', borderRadius:'12px', fontSize:'13px',
        display:'flex', alignItems:'center', gap:'10px',
        boxShadow:'0 4px 20px rgba(0,0,0,0.3)',
        fontFamily:"'Prompt',sans-serif", whiteSpace:'nowrap'
      });
      document.body.appendChild(b);
      Object.assign(document.getElementById('upd-ok').style,
        {background:'#fff',color:'#1E40AF',border:'none',
         borderRadius:'6px',padding:'4px 12px',cursor:'pointer',
         fontSize:'12px',fontWeight:'700'});
      Object.assign(document.getElementById('upd-x').style,
        {background:'none',border:'none',color:'#93C5FD',
         cursor:'pointer',fontSize:'16px',lineHeight:'1'});
      document.getElementById('upd-ok').onclick = () => { const u=location.href.split('?')[0]+'?_t='+Date.now(); location.replace(u); };
      document.getElementById('upd-x').onclick  = () => b.remove();
    };

    window.addEventListener('load', check);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
    setInterval(() => { if(!document.hidden) check(); }, 10*60*1000); // ทุก 10 นาที
  })();
  </script>

// localStorage helpers
const lsGet = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(_e) { return fallback; } };
const lsSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(_e) {} };

// บีบอัดรูป — ย่อ pixel ไม่เกิน 1920px, quality เริ่มที่ 0.92, ไม่เกิน 500KB
const resizeImage = (file, maxPx = 1920, maxBytes = 375000) => new Promise(resolve => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(blobUrl);
    // ลด quality ซ้ำจนขนาด base64 ไม่เกิน maxBytes
    let q = 0.92;
    let b64 = c.toDataURL("image/jpeg", q);
    while (b64.length * 0.75 > maxBytes && q > 0.1) {
      q = Math.max(0.1, q - 0.05);
      b64 = c.toDataURL("image/jpeg", q);
    }
    resolve(b64);
  };
  img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(null); };
  img.src = blobUrl;
});

// --- เพิ่มฟังก์ชันแปลง Base64 และอัปโหลดไปยัง Storage ตรงนี้ ---
  const base64ToBlob = (base64Str) => {
    const parts = base64Str.split(';base64,');
    const contentType = parts[0].split(':')[1];
    const raw = window.atob(parts[1]);
    const rawLength = raw.length;
    const uInt8Array = new Uint8Array(rawLength);
    for (let i = 0; i < rawLength; ++i) {
      uInt8Array[i] = raw.charCodeAt(i);
    }
    return new Blob([uInt8Array], { type: contentType });
  };

  const uploadImageToStorage = async (base64Str, folder = 'logs') => {
    if (!base64Str) return null;
    const blob = base64ToBlob(base64Str);
    const fileName = `${folder}-${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;
    const MAX_RETRIES = 2;
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      try {
        const { data, error } = await supabase.storage
          .from('exercise-photos')
          .upload(fileName, blob, { contentType: 'image/jpeg', upsert: true });
        if (error) throw error;
        const { data: { publicUrl } } = supabase.storage
          .from('exercise-photos')
          .getPublicUrl(fileName);
        return publicUrl;
      } catch (err) {
        console.error(`Storage Upload Error (attempt ${attempt + 1}):`, err.message);
        if (attempt < MAX_RETRIES) {
          await new Promise(r => setTimeout(r, 1000 * (attempt + 1))); // 1s, 2s
        }
      }
    }
    return null;
  };

const sbFetchLogs = async () => {
  const BATCH = 1000;
  let allData = [], from = 0;
  while (true) {
    const { data, error } = await supabase
      .from('exercise_logs')
      .select('id,employee_id,user_name,group_name,exercise,duration,calories,log_date,note,likes,verified,admin_comment')
      .order('log_date', { ascending: false })
      .order('created_at', { ascending: false })
      .range(from, from + BATCH - 1);
    if (error) throw new Error(error.message);
    if (!data || data.length === 0) break;
    allData = allData.concat(data);
    if (data.length < BATCH) break;
    from += BATCH;
  }
  const data = allData;
  return (data || []).map(i => ({
    id: i.id, spId: i.id,
    empId: i.employee_id || null,
    user: i.user_name || '', group: i.group_name || '',
    exercise: i.exercise || '', duration: Number(i.duration) || 0,
    calories: Number(i.calories) || 0, date: i.log_date || '',
    note: i.note || '', likes: Number(i.likes) || 0, hasPhoto: false,
    verified: i.verified || false,
    adminComment: i.admin_comment || '',
  }));
};

async function sbToggleLike(logId, empId) {
  const { data } = await supabase.from('log_likes').select('id').eq('log_id', logId).eq('employee_id', empId).maybeSingle();
  if (data) {
    await supabase.from('log_likes').delete().eq('log_id', logId).eq('employee_id', empId);
    return false; // unliked
  } else {
    await supabase.from('log_likes').insert({ log_id: logId, employee_id: empId });
    return true;  // liked
  }
}

// group_name อาจเก็บเป็น JSON string จากระบบเก่า เช่น '{"Value":"A : ..."}'
const cleanGroupName = (v) => {
  if (!v) return '';
  if (typeof v === 'string' && v.trim().startsWith('{')) {
    try { const p = JSON.parse(v); return (p?.Value || '').trim(); } catch {}
  }
  return v.trim();
};
const sbFetchUsersOnce = async () => {
  const { data, error } = await supabase.from('user_profiles').select('display_name,group_name,employee_id,photo,profile_icon,weekly_goal').limit(5000);
  if (error) return { allUsers: [], avatars: {} };
  const allUsers = (data||[]).map(u => ({ user: (u.display_name||'').trim(), group: cleanGroupName(u.group_name), empId: u.employee_id, profileIcon: u.profile_icon || null, weeklyGoal: u.weekly_goal ?? 5000 }));

};

const getLast7Days = (userLogs) => {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = thaiDate(d);
    const cal = userLogs.filter(l => l.date === ds).reduce((s, l) => s + l.calories, 0);
    days.push({ date: ds, cal, label: ["อา","จ","อ","พ","พฤ","ศ","ส"][d.getDay()] });
  }
  return days;
};

// ── Diamond 777 Matrix Popup ─────────────────────────────────
function DiamondMatrixPopup({ userName, onClose }) {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    const cv = canvasRef.current;
    if (!cv) return;
    const cx = cv.getContext('2d');
    cv.width  = cv.offsetWidth;
    cv.height = cv.offsetHeight;
    const W = cv.width, H = cv.height;
    const nameChars = [...(userName || 'YOU')];
    const pool = [
      ...nameChars,...nameChars,...nameChars,
      '7','7','7','💎','0','1','2','3','4','5','6','8','9','·','✦',
    ];
    const cols = Math.floor(W / 15);
    const drops = Array.from({length: cols}, () => Math.random() * -(H / 15));
    const timer = setInterval(() => {
      cx.fillStyle = 'rgba(0,0,0,0.055)';
      cx.fillRect(0, 0, W, H);
      drops.forEach((y, i) => {
        const ch = pool[Math.floor(Math.random() * pool.length)];
        const isName = nameChars.includes(ch);
        cx.shadowBlur = 0;
        if (ch === '💎') {
          cx.font = '12px monospace'; cx.fillStyle = '#93C5FD';
          cx.shadowBlur = 6; cx.shadowColor = '#3B82F6';
        } else if (isName) {
          cx.font = 'bold 14px monospace';
          cx.fillStyle = `rgba(96,${150 + Math.random()*105|0},253,.9)`;
          cx.shadowBlur = 12; cx.shadowColor = '#60A5FA';
        } else if (ch === '7') {
          cx.font = 'bold 14px monospace'; cx.fillStyle = '#fff';
          cx.shadowBlur = 14; cx.shadowColor = '#93C5FD';
        } else {
          cx.font = '12px monospace';
          cx.fillStyle = `rgba(20,50,${70+Math.random()*70|0},.45)`;
        }
        cx.fillText(ch, i * 15, y * 15);
        cx.shadowBlur = 0;
        if (y * 15 > H && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }, 40);
    return () => clearInterval(timer);
  }, [userName]);

  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:900, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <canvas ref={canvasRef} style={{ position:'absolute', inset:0, width:'100%', height:'100%', background:'#000' }} />
      <div onClick={e=>e.stopPropagation()} style={{
        position:'relative', background:'rgba(0,0,0,.88)', border:'2px solid #60A5FA',
        borderRadius:24, padding:'28px 32px 22px', textAlign:'center', width:270,
        boxShadow:'0 0 60px rgba(96,165,250,.5)', animation:'pop-in .5s cubic-bezier(.34,1.56,.64,1) both',
      }}>
        <div style={{ fontSize:9, color:'#93C5FD', letterSpacing:4, fontFamily:'monospace', marginBottom:12 }}>✦ SPECIAL ACHIEVEMENT ✦</div>
        <div style={{ fontSize:80, filter:'drop-shadow(0 0 18px #00ff41) drop-shadow(0 0 40px #00cc33)', animation:'float 3s ease-in-out infinite', display:'block', marginBottom:10 }}>🍀</div>
        <div style={{ fontFamily:'monospace', fontSize:26, fontWeight:900, letterSpacing:6, color:'#60A5FA', textShadow:'0 0 20px #3B82F6', marginBottom:6 }}>7·7·7</div>
        <div style={{ fontFamily:'monospace', fontSize:17, fontWeight:900, letterSpacing:2, color:'#DBEAFE', textShadow:'0 0 10px #60A5FA', marginBottom:4 }}>MIRACLE 7</div>
        <div style={{ fontSize:10, color:'#6B94C8', marginBottom:14 }}>7 sessions ≥ 777 kcal · กรกฎาคม 2026</div>
        <div style={{ background:'rgba(96,165,250,.12)', border:'1.5px solid rgba(96,165,250,.4)', borderRadius:12, padding:'10px 16px', marginBottom:16 }}>
          <div style={{ fontSize:8, color:'#60A5FA', letterSpacing:3, fontFamily:'monospace', marginBottom:5 }}>UNLOCKED BY</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#fff', letterSpacing:2, fontFamily:'monospace', textShadow:'0 0 18px #60A5FA, 0 0 40px #3B82F6' }}>{userName}</div>
        </div>
        <button onClick={onClose} style={{ background:'#3B82F6', color:'#fff', border:'none', borderRadius:10, padding:'8px 24px', fontSize:13, fontWeight:700, cursor:'pointer', fontFamily:'Prompt,sans-serif' }}>ปิด</button>
      </div>

  );
}

function MillionPopup({ onClose }) {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    const cv = canvasRef.current; if (!cv) return;
    const cx = cv.getContext('2d');
    cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
    const W = cv.width, H = cv.height;
    // confetti particles
    const particles = Array.from({length: 120}, () => ({
      x: Math.random() * W, y: Math.random() * H - H,
      r: 4 + Math.random() * 6,
      color: ['#f472b6','#ec4899','#db2777','#fbcfe8','#f9a8d4','#fce7f3','#ff80ab'][Math.floor(Math.random()*7)],
      vx: (Math.random() - 0.5) * 2, vy: 1.5 + Math.random() * 2.5,
      rot: Math.random() * 360, rv: (Math.random()-0.5)*4,
    }));
    const timer = setInterval(() => {
      cx.clearRect(0,0,W,H);
      particles.forEach(p => {
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot * Math.PI/180);
        cx.fillStyle = p.color; cx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.5);
        cx.restore();
        p.x += p.vx; p.y += p.vy; p.rot += p.rv;
        if (p.y > H) { p.y = -10; p.x = Math.random()*W; }
      });
    }, 30);
    return () => clearInterval(timer);
  }, []);

  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:900, display:'flex', alignItems:'center', justifyContent:'center' }}>

};

        {url && <button className="v2-btn-ghost" onClick={download} style={{ flex: 1 }}>💾 บันทึกรูป</button>}

      </div>
    </div>
  );
}

  const isCalAnomaly = (name, duration, cal) => { const r = calcCalRange(name, duration); if(!r) return false; return cal > r.max * 1.5; };

    if (finalPhotoUrl && finalPhotoUrl.startsWith('data:')) {
      const uploadedUrl = await uploadImageToStorage(finalPhotoUrl, 'logs');

    const calRangeForCap = calcCalRange(form.exercise, form.duration);

        .tab-scroll::-webkit-scrollbar{display:none}

                  <div style={{ textAlign:"center", color:"#9CA3AF", padding:"30px 0", fontSize:13 }}>ไม่พบรายการผิดปกติ ✅</div>
                ):(
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                    {anomalyLogs.map(l=>{
                      const range=calcCalRange(l.exercise,l.duration);
                      const color=getGroupColor(currentGroup(l));
                      return(
                        <div key={l.id} className="v2-card" style={{ padding:"12px 14px", borderLeft:"3px solid #F59E0B" }}>
                          <div style={{ display:"flex", justifyContent:"spaceBeween", alignItems:"center", marginBottom:4 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                              <span style={{ fontWeight:700, fontSize:13 }}>{profileIconMap[l.user]&&<span style={{ marginRight:2 }}>{profileIconMap[l.user]}</span>}{l.user}</span>
                              <span style={{ fontSize:10, background:color+"18", color, borderRadius:999, padding:"1px 7px", fontWeight:700 }}>{grpLabel(currentGroup(l))}</span>
                            </div>
                            <span style={{ fontSize:11, color:"#6B7280" }}>{l.date}</span>
                          </div>
                          <div style={{ fontSize:12, color:"#6B7280" }}>
                            {l.exercise} · {l.duration} นาที · <strong style={{ color:"#D97706" }}>{l.calories} kcal</strong>
                            {range&&<span style={{ color:"#9CA3AF", marginLeft:6 }}>(ปกติ {range.min}–{range.max})</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              );
            })()}

          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:50, background:"rgba(255,255,255,0.92)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", borderTop:"1px solid rgba(0,0,0,0.06)", paddingBottom:"env(safe-area-inset-bottom,0px)" }}>
        <div style={{ maxWidth:680, margin:"0 auto", display:"flex", overflowX:"auto" }}>
          {tabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
              className={`v2-nav-btn${activeTab===tab.id?" v2-nav-on":""}`}>
              <span style={{ fontSize:20 }}>{tab.icon}</span>
              <span>{tab.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalorieTracker />);
  </script>
</body>
</html>
