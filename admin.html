// ── Exercise Cal Ranges (เดียวกับ Calapp_v2) ─────────────────
const EXERCISES = [
  { name: "วิ่ง",         calMin: 7,  calMax: 14 },
  { name: "ว่ายน้ำ",      calMin: 6,  calMax: 12 },
  { name: "ปั่นจักรยาน",  calMin: 5,  calMax: 10 },
  { name: "เดิน",          calMin: 3,  calMax: 6  },
  { name: "โยคะ",          calMin: 2,  calMax: 5  },
  { name: "ยกเวท",         calMin: 4,  calMax: 9  },
  { name: "HIIT",          calMin: 9,  calMax: 16 },
  { name: "กระโดดเชือก",  calMin: 8,  calMax: 14 },
  { name: "แบดมินตัน",    calMin: 5,  calMax: 10 },
  { name: "ฟุตบอล",        calMin: 6,  calMax: 11 },
  { name: "พายเรือ",       calMin: 5,  calMax: 10 },
  { name: "เข้ายิม",       calMin: 4,  calMax: 9  },
  { name: "มวย",           calMin: 7,  calMax: 13 },
  { name: "กอล์ฟ",         calMin: 2,  calMax: 5  },
  { name: "อื่นๆ",         calMin: 3,  calMax: 8  },
];
const calcCalRange = (name, duration) => {
  const ex = EXERCISES.find(e => e.name === name);
  if (!ex) return null;
  return { min: ex.calMin * duration, max: ex.calMax * duration };
};
const isCalAnomaly = (name, duration, cal) => {
  const r = calcCalRange(name, duration);
  if (!r) return false;
  return cal > r.max * 1.5;
};

// ── Helpers ──────────────────────────────────────────────────
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// บีบรูป base64 ให้ไม่เกิน maxBytes
const compressBase64 = (b64, maxBytes = 20000) => new Promise(resolve => {
  if (!b64 || !b64.startsWith("data:image")) { resolve(b64); return; }
  const img = new Image();
  img.onload = () => {
    const maxPx = 300;
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let q = 0.8, out = c.toDataURL("image/jpeg", q);
    while (out.length * 0.75 > maxBytes && q > 0.1) { q = Math.max(0.1, q - 0.1); out = c.toDataURL("image/jpeg", q); }
    resolve(out);
  };
  img.onerror = () => resolve(b64);
  img.src = b64;
});


// ── Supabase API Helpers ──────────────────────────────────────
async function sbGetUsers() {
  const { data, error } = await supabase.from('user_profiles')
    .select('employee_id,display_name,group_name,role,photo');
  if (error) throw new Error(error.message);
  return (data || []).map(u => ({
    EmployeeID: u.employee_id, DisplayName: u.display_name,
    GroupName: u.group_name || '', Role: u.role || 'user', Photo: u.photo || '',
  }));
}

async function sbGetLogs() {
  const { data, error } = await supabase.from('exercise_logs')
    .select('*').order('created_at', { ascending: false }).limit(1000);
  if (error) throw new Error(error.message);
  return (data || []).map(i => ({
    id: i.id, spId: i.id,
    empId: i.employee_id || null,
    user: i.user_name || '', group: i.group_name || '',
    exercise: i.exercise || '', duration: Number(i.duration)||0,
    calories: Number(i.calories)||0, date: i.log_date||'',
    note: i.note||'', photo: i.photo||'', likes: Number(i.likes)||0,
    createdAt: i.created_at||'', verified: i.verified || false,
    adminComment: i.admin_comment || '',
  }));
}

async function sbSetVerified(id, verified) {
  const { error } = await supabase.from('exercise_logs').update({ verified }).eq('id', id);
  if (error) throw new Error(error.message);
}

// ── CommentBox component (ใช้ได้ทั้ง LogRow และ Anomaly) ────────

  const changed = draft !== (initial || '');
  return (
    <div style={{ display:"flex", gap:8, alignItems:"center", marginTop:8 }}>
      <span style={{ fontSize:12, color:"#D97706", flexShrink:0 }}>💬</span>

        style={{ flex:1, fontSize:11, padding:"5px 10px", borderRadius:8, border:"1.5px solid #FDE68A", background:"#FFFBEB", fontFamily:"'Sarabun'" }} />
      {changed && <button onClick={()=>onSave(draft)} style={{ background:"#16A34A", border:"none", color:"#fff", borderRadius:7, padding:"5px 10px", fontSize:11, cursor:"pointer", fontFamily:"'Prompt'", fontWeight:700, whiteSpace:"nowrap" }}>บันทึก</button>}
    </div>
  );
}

// ── LogRow component (แยกเพื่อให้ useState ใช้ใน map ได้) ──────

              style={{ background: l.verified?"#DCFCE7":"#F3F4F6", border: l.verified?"1.5px solid #22C55E":"1.5px solid #D1D5DB", borderRadius:8, width:30, height:30, cursor:"pointer", fontSize:15, display:"flex", alignItems:"center", justifyContent:"center", transition:"all .15s" }}>

  const { error } = await supabase.from('exercise_logs').update({ admin_comment: comment || null }).eq('id', id);
  if (error) throw new Error(error.message);
}

async function sbDeleteLog(id) {

  const { error } = await supabase.from('user_profiles').delete().eq('employee_id', empId);

  const { data: existing } = await supabase.from('user_profiles').select('employee_id').eq('employee_id', empId).single();
  if (existing) throw new Error('รหัสพนักงานนี้มีอยู่แล้ว');
const { error } = await supabase.from('user_profiles').insert({

    display_name: displayName,

    password_hash: password, // เก็บตรง ๆ ไม่ต้องแฮช
    role,
    photo: null,
  });
  if (error) throw new Error(error.message || 'เพิ่ม User ไม่สำเร็จ');

async function sbLoginUser(empId, password) {
  const { data, error } = await supabase.from('user_profiles').select('*').eq('employee_id', empId).single();
  if (error || !data) throw new Error('รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง');
if (password !== data.password_hash) throw new Error('รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง');
  
  return { EmployeeID: data.employee_id, DisplayName: data.display_name, GroupName: data.group_name || '', Role: data.role || 'user', role: data.role || 'user' };
}

async function sbUpdateUserPhoto(empId, photo) {
  const { error } = await supabase.from('user_profiles').update({ photo }).eq('employee_id', empId);
  if (error) throw new Error(error.message);
}

async function sbUpdateUserName(empId, oldName, newName) {
  // 1. อัปเดตชื่อใน user_profiles
  const { error: e1 } = await supabase.from('user_profiles')
    .update({ display_name: newName }).eq('employee_id', empId);
  if (e1) throw new Error(e1.message);
  // 2. อัปเดต exercise_logs ที่ match ด้วย employee_id (กรณีปกติ)
  const { error: e2 } = await supabase.from('exercise_logs')
    .update({ user_name: newName }).eq('employee_id', empId);
  if (e2) throw new Error(e2.message);
  // 3. อัปเดต legacy logs ที่ match ด้วยชื่อเก่า (ไม่มี employee_id)
  await supabase.from('exercise_logs')
    .update({ user_name: newName })
    .eq('user_name', oldName)
    .is('employee_id', null);
}

  const { error } = await supabase.from('user_profiles')
    .update({ password_hash: newPassword }).eq('employee_id', empId);
  if (error) throw new Error(error.message);
}

    display_name: w.display_name,

  const { error: e2 } = await supabase.from('waiting_profile').delete().eq('employee_id', w.employee_id);
  if (e2) throw new Error(e2.message);

// ── Main App ─────────────────────────────────────────────────
function AdminApp() {
  const [authUser, setAuthUser] = useState(() => lsGet("tvohh_admin_session", null));
  const [loginForm, setLoginForm] = useState({ empId: "", password: "" });
  const [loginErr, setLoginErr]   = useState("");
  const [loginLoading, setLoginLoading] = useState(false);
  const [activeTab, setActiveTab] = useState("users");
  const [toast, setToast]         = useState("");

  // Data
  const [users, setUsers]   = useState([]);
  const [logs, setLogs]     = useState([]);
  const [loading, setLoading] = useState(false);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(""), 3000); };

  // ── Verify Session: ตรวจ role จาก cache ──────────────────────
  useEffect(() => {
    const stored = lsGet("tvohh_admin_session", null);
    if (!stored || !stored.EmployeeID) return;
    if ((stored.role || stored.Role || "user") !== "admin") {
      localStorage.removeItem("tvohh_admin_session");
      setAuthUser(null);
    }
  }, []);

  // ── Login ──────────────────────────────────────────────────
  // ดึงค่าจาก SharePoint Choice field (อาจเป็น object, JSON string, หรือ string ปกติ)
  const parseChoice = (v, fallback) => {
    if (!v) return fallback;
    if (typeof v === "object") return v?.Value ?? fallback;
    if (typeof v === "string" && v.trim().startsWith("{")) {
      try { const p = JSON.parse(v); return p?.Value ?? fallback; } catch {}
    }
    return v;
  };

  const handleLogin = async () => {
    setLoginErr("");
    if (!loginForm.empId || !loginForm.password) return setLoginErr("กรุณากรอกรหัสพนักงานและรหัสผ่าน");
    setLoginLoading(true);
    try {
      const raw  = await sbLoginUser(loginForm.empId.trim(), loginForm.password);
      const role  = raw.role || raw.Role || "user";
      const group = raw.GroupName || raw.group || "";
      const user  = { ...raw, role, group };
      if (role !== "admin") { setLoginErr("บัญชีนี้ไม่มีสิทธิ์ Admin"); return; }
      lsSet("tvohh_admin_session", user);
      setAuthUser(user);
      showToast("เข้าสู่ระบบ Admin สำเร็จ 🔐");
    } catch { setLoginErr("รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง"); }
    finally { setLoginLoading(false); }
  };

  const handleLogout = () => { localStorage.removeItem("tvohh_admin_session"); setAuthUser(null); };

  // ── Load Users ─────────────────────────────────────────────
  const loadUsers = useCallback(async () => {
    setLoading(true);
    try {
      const data = await sbGetUsers();
      setUsers(data);
    }
    catch(e) { console.error("[GET_USERS] error:", e); showToast("โหลด Users ไม่สำเร็จ"); }
    finally { setLoading(false); }
  }, []);

  // ── Load Logs ──────────────────────────────────────────────
  const loadLogs = useCallback(async () => {
    setLoading(true);
    try {
      const data = await sbGetLogs();
      setLogs(data);
    }
    catch(e) { console.error("[GET_LOGS]", e); showToast("โหลด Logs ไม่สำเร็จ"); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => {
    if (!authUser) return;
    if (activeTab === "users")   loadUsers();
    if (activeTab === "logs" || activeTab === "anomaly") loadLogs();
    if (activeTab === "waiting") loadWaiting();
  }, [authUser, activeTab]);

  // ── Delete User + ดึง logs สด แล้วลบทั้งหมดของ user ──────────
  const deleteUser = async (empId, displayName) => {
    if (!window.confirm(`ลบ User "${displayName}" และ Log กิจกรรมทั้งหมดของ user นี้?\nการกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
    try {
      showToast("กำลังลบ...");
      await sbDeleteUser(empId, displayName);
      showToast(`ลบ User "${displayName}" และ Log ทั้งหมดสำเร็จ ✅`);
      loadUsers();
      loadLogs();
    } catch(e) { console.error("[DELETE_USER] error:", e); showToast("❌ ลบไม่สำเร็จ: " + e.message); }
  };

  // ── Compress all profile photos ────────────────────────────
  const [compressing, setCompressing] = useState(false);
  const compressAllPhotos = async () => {
    if (!window.confirm(`อัปโหลดรูปโปรไฟล์ทั้งหมด ${users.length} คน ไปยัง Storage?\nอาจใช้เวลา 1-2 นาที`)) return;
    setCompressing(true);
    let ok = 0, skip = 0, fail = 0;
    for (const u of users) {
      try {
        const photo = u.Photo || "";
        // ข้ามถ้าไม่มีรูป หรือเป็น URL แล้ว (ไม่ใช่ Base64)
        if (!photo || !photo.startsWith("data:image")) { skip++; continue; }
        const compressed = await compressBase64(photo);
        // แปลง base64 → blob → อัปโหลด Storage
        const res = await fetch(compressed);
        const blob = await res.blob();
        const fileName = `avatars/${u.EmployeeID}.jpg`;
        const { error: upErr } = await supabase.storage
          .from('exercise-photos')
          .upload(fileName, blob, { contentType: 'image/jpeg', upsert: true });
        if (upErr) throw new Error(upErr.message);
        const { data: urlData } = supabase.storage
          .from('exercise-photos')
          .getPublicUrl(fileName);
        const publicUrl = urlData.publicUrl;
        await sbUpdateUserPhoto(u.EmployeeID, publicUrl);
        ok++;
        showToast(`อัปโหลดรูป ${u.DisplayName} ✅ (${ok}/${users.length})`);
      } catch(e) { fail++; console.error("compress fail:", u.DisplayName, e); }
    }
    setCompressing(false);
    showToast(`เสร็จแล้ว ✅ อัปโหลด Storage ${ok} | ข้าม ${skip} | ผิดพลาด ${fail}`);
  };

  // ── Delete Log ─────────────────────────────────────────────
  const toggleVerified = async (id, current) => {
    try {
      await sbSetVerified(id, !current);
      setLogs(prev => prev.map(l => l.id === id ? { ...l, verified: !current } : l));
    } catch(e) { showToast("❌ บันทึกไม่สำเร็จ: " + e.message); }
  };

  const saveComment = async (id, comment) => {
    try {
      await sbSetComment(id, comment);
      setLogs(prev => prev.map(l => l.id === id ? { ...l, adminComment: comment } : l));
      showToast("💬 บันทึก comment แล้ว");
    } catch(e) { showToast("❌ " + e.message); }
  };

  const deleteLog = async (id) => {
    if (!window.confirm("ลบ Log นี้จริงหรือ?")) return;
    if (!id) { showToast("❌ ID ไม่ถูกต้อง"); return; }
    try {
      showToast("กำลังลบ...");
      await sbDeleteLog(id);
      showToast("✅ ลบ Log สำเร็จ"); loadLogs();
    } catch(e) { console.error("[DELETE_LOG] error:", e); showToast("❌ ลบ Log ไม่สำเร็จ: " + e.message); }
  };

  // ── Add User (Admin can add) ───────────────────────────────
  const TEAM_NAMES = ["A : ใส่ใจลูกค้า", "B : ร่วมแรงร่วมใจ", "C : ยืดหยุ่นคล่องตัว", "D : ว่องไวเป็นเลิศ"];
  const [addForm, setAddForm] = useState({ empId: "", displayName: "", group: "A : ใส่ใจลูกค้า", password: "", role: "user" });
  const [addErr, setAddErr]   = useState("");

  // ── Goals Management ──────────────────────────────────────
  const [adminGoals, setAdminGoals] = useState(() => lsGet("tvohh_goals", {}));
  const [goalUser, setGoalUser]     = useState("");
  const [goalValue, setGoalValue]   = useState(5000);
  const saveGoal = () => {
    if (!goalUser) return;
    const next = { ...adminGoals, [goalUser]: { weekly: goalValue } };
    setAdminGoals(next); lsSet("tvohh_goals", next);
    showToast(`ตั้งเป้าหมายให้ ${goalUser} แล้ว! 🎯`);
  };
  const deleteGoal = (user) => {
    const next = { ...adminGoals }; delete next[user];
    setAdminGoals(next); lsSet("tvohh_goals", next);
    showToast("ลบเป้าหมายแล้ว");
  };

  // ── Waiting Members ──────────────────────────────────────
  const [waiting, setWaiting]         = useState([]);
  const [waitingLoading, setWaitingLoading] = useState(false);

  const loadWaiting = useCallback(async () => {
    setWaitingLoading(true);
    try {
      const data = await sbGetWaiting();
      setWaiting(data);
    } catch(e) { showToast("โหลด waiting_profile ไม่สำเร็จ: " + e.message); }
    finally { setWaitingLoading(false); }
  }, []);

  const activateUser = async (w) => {
    if (!window.confirm(`อนุมัติ "${w.display_name}" (${w.employee_id}) เข้าสู่ระบบ?`)) return;
    try {
      await sbActivateUser(w);
      showToast(`✅ อนุมัติ ${w.display_name} สำเร็จ`);
      loadWaiting();
      if (activeTab === "users") loadUsers();
    } catch(e) { showToast("❌ " + e.message); }
  };

  const rejectWaiting = async (w) => {
    if (!window.confirm(`ปฏิเสธและลบ "${w.display_name}" ออกจากรายการรออนุมัติ?`)) return;
    try {
      await sbRejectWaiting(w.employee_id);
      showToast(`ลบ ${w.display_name} ออกจากรายการแล้ว`);
      loadWaiting();
    } catch(e) { showToast("❌ " + e.message); }
  };

  const handleAddUser = async () => {
    setAddErr("");
    if (!addForm.empId || !addForm.displayName || !addForm.password) return setAddErr("กรุณากรอกให้ครบ");
    try {
      await sbRegisterUser(addForm.empId.trim(), addForm.displayName.trim(), addForm.group, addForm.password, addForm.role);
      showToast("เพิ่ม User สำเร็จ ✅");
      setAddForm({ empId: "", displayName: "", group: "A : ใส่ใจลูกค้า", password: "", role: "user" });
      loadUsers();
    } catch(e) { setAddErr("เพิ่ม User ไม่สำเร็จ: " + e.message); }
  };

  // ── Edit User Modal ────────────────────────────────────────
  const [editUser, setEditUser] = useState(null);
  const [editForm, setEditForm] = useState({ displayName: '', newPassword: '', confirmPassword: '' });
  const [editErr, setEditErr]   = useState('');
  const [editLoading, setEditLoading] = useState(false);

  const openEdit = (u) => {
    setEditUser(u);
    setEditForm({ displayName: u.DisplayName, newPassword: '', confirmPassword: '' });
    setEditErr('');
  };
  const closeEdit = () => { setEditUser(null); setEditErr(''); };

  const handleEditSave = async () => {
    setEditErr('');
    if (!editForm.displayName.trim()) return setEditErr('กรุณากรอกชื่อ');
    if (editForm.newPassword && editForm.newPassword !== editForm.confirmPassword)
      return setEditErr('รหัสผ่านใหม่ไม่ตรงกัน');
    setEditLoading(true);
    try {
      const nameChanged = editForm.displayName.trim() !== editUser.DisplayName;
      if (nameChanged)
        await sbUpdateUserName(editUser.EmployeeID, editUser.DisplayName, editForm.displayName.trim());
      if (editForm.newPassword)
        await sbUpdatePassword(editUser.EmployeeID, editForm.newPassword);
      if (!nameChanged && !editForm.newPassword)
        return setEditErr('ไม่มีการเปลี่ยนแปลง');
      showToast('✅ แก้ไขข้อมูล User สำเร็จ');
      closeEdit();
      loadUsers();
      if (nameChanged) loadLogs();
    } catch(e) { setEditErr('❌ ' + e.message); }
    finally { setEditLoading(false); }
  };

  // ════════════════════════════════════════════════════════════
  // LOGIN SCREEN
  // ════════════════════════════════════════════════════════════
  if (!authUser) return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#F0FDF4,#DCFCE7)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 380 }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ fontSize: 48, marginBottom: 8 }}>🔐</div>
          <h1 style={{ fontFamily: "'Prompt'", fontWeight: 900, fontSize: 22, color: GREEN }}>TVO Calories Challenge</h1>
          <p style={{ color: "#6B7280", fontSize: 13, marginTop: 4 }}>Admin Management</p>
        </div>
        <div className="card" style={{ padding: 28 }}>
          <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, marginBottom: 18, color: "#1F2937", fontSize: 15 }}>เข้าสู่ระบบ Admin</h3>
          <label>รหัสพนักงาน</label>
          <input className="inp" style={{ marginBottom: 12 }} placeholder="เช่น 1234" value={loginForm.empId}
            onChange={e => setLoginForm(p => ({ ...p, empId: e.target.value }))}
            onKeyDown={e => e.key === "Enter" && handleLogin()} />
          <label>รหัสผ่าน</label>
          <input className="inp" style={{ marginBottom: 16 }} type="password" placeholder="••••••••" value={loginForm.password}
            onChange={e => setLoginForm(p => ({ ...p, password: e.target.value }))}
            onKeyDown={e => e.key === "Enter" && handleLogin()} />
          {loginErr && <div style={{ color: "#DC2626", fontSize: 12, marginBottom: 12, background: "#FEF2F2", padding: "8px 12px", borderRadius: 8 }}>{loginErr}</div>}
          <button className="btn-g" style={{ width: "100%", padding: 12, fontSize: 14 }} onClick={handleLogin} disabled={loginLoading}>
            {loginLoading ? "กำลังเข้าสู่ระบบ..." : "เข้าสู่ระบบ"}
          </button>
          <div style={{ marginTop: 16, textAlign: "center" }}>
            <a href="index.html" style={{ color: "#9CA3AF", fontSize: 12, textDecoration: "none" }}>← กลับสู่แอพหลัก</a>
          </div>
        </div>
      </div>
    </div>
  );

  // ════════════════════════════════════════════════════════════
  // ADMIN DASHBOARD
  // ════════════════════════════════════════════════════════════
  const tabs = [
    { id: "users",   icon: "👥", label: "จัดการ Users" },
    { id: "waiting", icon: "⏳", label: "รออนุมัติ" },
    { id: "adduser", icon: "➕", label: "เพิ่ม User" },
    { id: "logs",    icon: "📋", label: "Logs ทั้งหมด" },
    { id: "anomaly", icon: "🔍", label: "ตรวจสอบ" },
    { id: "stats",   icon: "📊", label: "สถิติ" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#F0FDF4" }}>
      {/* Toast */}
      {toast && (
        <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", zIndex: 999, background: "#ECFDF5", border: "1px solid #6EE7B7", borderRadius: 12, padding: "12px 22px", fontFamily: "'Prompt'", color: GREEN, boxShadow: "0 8px 30px #00000040", whiteSpace: "nowrap" }}>
          {toast}
        </div>
      )}

      {/* Header */}
      <div style={{ background: "linear-gradient(135deg,#16A34A,#22C55E)", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", boxShadow: "0 2px 16px #16A34A30" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 22 }}>🔐</span>
          <div>
            <div style={{ fontFamily: "'Prompt'", fontWeight: 700, fontSize: 16, color: "#fff" }}>Admin Panel</div>
            <div style={{ fontSize: 10, color: "#DCFCE7" }}>TVO Calories Challenge</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ background: "#ffffff25", borderRadius: 20, padding: "4px 12px", fontSize: 12, color: "#fff", fontFamily: "'Sarabun'" }}>
            🧑 {authUser.DisplayName}
          </div>
          <button onClick={handleLogout} style={{ background: "#ffffff25", border: "1px solid #ffffff50", borderRadius: 8, padding: "5px 12px", cursor: "pointer", fontSize: 12, color: "#fff", fontFamily: "'Sarabun'" }}>ออก</button>
          <a href="index.html" style={{ background: "#ffffff25", border: "1px solid #ffffff50", borderRadius: 8, padding: "5px 12px", cursor: "pointer", fontSize: 12, color: "#fff", fontFamily: "'Sarabun'", textDecoration: "none" }}>← แอพ</a>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "24px 16px 60px" }}>
        {/* Tab nav */}
        <div className="tb-wrap">
          {tabs.map(t => (
            <button key={t.id} className={`tb-btn ${activeTab === t.id ? "on" : ""}`} onClick={() => setActiveTab(t.id)}
              style={{ position:"relative" }}>
              {t.icon} {t.label}
              {t.id === "waiting" && waiting.length > 0 && (
                <span style={{ position:"absolute", top:2, right:2, background:"#EF4444", color:"#fff", borderRadius:"50%", width:16, height:16, fontSize:9, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", lineHeight:1 }}>
                  {waiting.length}
                </span>
              )}
            </button>
          ))}
        </div>

        {/* ── USERS TAB ── */}
        {activeTab === "users" && (
          <div className="card" style={{ padding: 22 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, color: GREEN, fontSize: 15 }}>👥 รายชื่อ Users ทั้งหมด</h3>
              <div style={{ display:"flex", gap:8 }}>
                <button className="btn-g" onClick={loadUsers} disabled={loading}>{loading ? "กำลังโหลด..." : "🔄 รีเฟรช"}</button>
                <button className="btn-g" onClick={compressAllPhotos} disabled={compressing || users.length===0}
                  style={{ background:"linear-gradient(135deg,#0891B2,#06B6D4)" }}>
                  {compressing ? "⏳ กำลังบีบ..." : "🗜️ บีบรูปโปรไฟล์ทั้งหมด"}
                </button>
              </div>
            </div>
            {users.length === 0 ? (
              <div style={{ textAlign: "center", color: "#9CA3AF", padding: "30px 0", fontSize: 13 }}>
                {loading ? "กำลังโหลด..." : "ไม่พบข้อมูล User — กด รีเฟรช"}
              </div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th>รหัสพนักงาน</th>
                      <th>ชื่อ</th>
                      <th>กลุ่ม</th>
                      <th>Role</th>
                      <th>จัดการ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {users.map((u, i) => (
                      <tr key={i}>
                        <td style={{ fontFamily: "'Prompt'", fontWeight: 600 }}>{u.EmployeeID}</td>
                        <td>{u.DisplayName}</td>
                        <td>{u.GroupName}</td>
                        <td>
                          <span className={`badge ${u.Role === "admin" ? "badge-admin" : "badge-user"}`}>
                            {u.Role === "admin" ? "🔐 Admin" : "👤 User"}
                          </span>
                        </td>
                        <td>
                          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                            <button
                              onClick={() => openEdit(u)}
                              style={{ background:"linear-gradient(135deg,#0891B2,#06B6D4)", color:"#fff", border:"none", borderRadius:10, padding:"5px 12px", cursor:"pointer", fontFamily:"'Prompt'", fontWeight:700, fontSize:12 }}>
                              ✏️ แก้ไข
                            </button>
                            {u.Role !== "admin" && (
                              <button className="btn-r" onClick={() => deleteUser(u.EmployeeID, u.DisplayName)}>🗑 ลบ</button>
                            )}
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div style={{ marginTop: 12, fontSize: 12, color: "#9CA3AF" }}>รวม {users.length} Users</div>
              </div>
            )}
          </div>
        )}

        {/* ── WAITING TAB ── */}
        {activeTab === "waiting" && (
          <div className="card" style={{ padding:22 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
              <h3 style={{ fontFamily:"'Prompt'", fontWeight:700, color:"#D97706", fontSize:15 }}>⏳ สมาชิกรออนุมัติ</h3>
              <button className="btn-g" onClick={loadWaiting} disabled={waitingLoading}
                style={{ background:"linear-gradient(135deg,#D97706,#F59E0B)" }}>
                {waitingLoading ? "กำลังโหลด..." : "🔄 รีเฟรช"}
              </button>
            </div>
            {waiting.length === 0 ? (
              <div style={{ textAlign:"center", color:"#9CA3AF", padding:"30px 0", fontSize:13 }}>
                {waitingLoading ? "กำลังโหลด..." : "✅ ไม่มีสมาชิกรออนุมัติ"}
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                {waiting.map((w, i) => {
                  const teamColors = {
                    "A : ใส่ใจลูกค้า": "#16A34A",
                    "B : ร่วมแรงร่วมใจ": "#0EA5E9",
                    "C : ยืดหยุ่นคล่องตัว": "#8B5CF6",
                    "D : ว่องไวเป็นเลิศ": "#F59E0B",
                  };
                  const tcolor = teamColors[w.group_name] || "#6B7280";
                  const createdDate = w.created_at ? new Date(w.created_at).toLocaleDateString('th-TH') : '-';
                  return (
                    <div key={i} style={{ border:"1.5px solid #FDE68A", borderRadius:14, padding:"14px 16px", background:"#FFFBEB", display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
                      {/* avatar */}
                      {w.photo ? (
                        <img src={w.photo} alt="" style={{ width:48, height:48, borderRadius:"50%", objectFit:"cover", border:"2px solid #FCD34D", flexShrink:0 }} />
                      ) : (
                        <div style={{ width:48, height:48, borderRadius:"50%", background:"#FEF3C7", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, border:"2px solid #FCD34D", flexShrink:0 }}>👤</div>
                      )}
                      {/* info */}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:700, fontSize:14, color:"#1F2937" }}>{w.display_name}</div>
                        <div style={{ fontSize:11, color:"#6B7280", marginTop:2 }}>
                          รหัส: <strong>{w.employee_id}</strong>
                          {" · "}<span style={{ color:tcolor, fontWeight:600 }}>{w.group_name || "—"}</span>
                          {" · "}สมัคร {createdDate}
                        </div>
                      </div>
                      {/* actions */}
                      <div style={{ display:"flex", gap:8, flexShrink:0 }}>
                        <button onClick={() => activateUser(w)}
                          style={{ background:"linear-gradient(135deg,#16A34A,#22C55E)", color:"#fff", border:"none", borderRadius:10, padding:"8px 16px", cursor:"pointer", fontFamily:"'Prompt'", fontWeight:700, fontSize:13 }}>
                          ✅ อนุมัติ
                        </button>
                        <button onClick={() => rejectWaiting(w)} className="btn-r">
                          ❌ ปฏิเสธ
                        </button>
                      </div>
                    </div>
                  );
                })}
                <div style={{ fontSize:12, color:"#9CA3AF", textAlign:"right" }}>รวม {waiting.length} รายการ</div>
              </div>
            )}
          </div>
        )}

        {/* ── ADD USER TAB ── */}
        {activeTab === "adduser" && (
          <div className="card" style={{ padding: 22 }}>
            <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, color: GREEN, fontSize: 15, marginBottom: 20 }}>➕ เพิ่ม User ใหม่</h3>
            <div className="form-row" style={{ marginBottom: 12 }}>
              <div>
                <label>รหัสพนักงาน *</label>
                <input className="inp" placeholder="เช่น 1234" value={addForm.empId} onChange={e => setAddForm(p => ({ ...p, empId: e.target.value }))} />
              </div>
              <div>
                <label>ชื่อ-นามสกุล *</label>
                <input className="inp" placeholder="เช่น สมชาย ใจดี" value={addForm.displayName} onChange={e => setAddForm(p => ({ ...p, displayName: e.target.value }))} />
              </div>
            </div>
            <div className="form-row" style={{ marginBottom: 12 }}>
              <div>
                <label>รหัสผ่าน *</label>
                <input className="inp" type="password" placeholder="••••••••" value={addForm.password} onChange={e => setAddForm(p => ({ ...p, password: e.target.value }))} />
              </div>
              <div>
                <label>กลุ่ม</label>
                <select className="inp" value={addForm.group} onChange={e => setAddForm(p => ({ ...p, group: e.target.value }))}>
                  {TEAM_NAMES.map(g => <option key={g}>{g}</option>)}
                </select>
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label>Role</label>
              <select className="inp" style={{ maxWidth: 200 }} value={addForm.role} onChange={e => setAddForm(p => ({ ...p, role: e.target.value }))}>
                <option value="user">👤 User (ทั่วไป)</option>
                <option value="admin">🔐 Admin</option>
              </select>
            </div>
            {addErr && <div style={{ color: "#DC2626", fontSize: 12, marginBottom: 12, background: "#FEF2F2", padding: "8px 12px", borderRadius: 8 }}>{addErr}</div>}
            <button className="btn-g" onClick={handleAddUser} style={{ padding: "11px 28px" }}>
              ➕ เพิ่ม User
            </button>
          </div>
        )}

        {/* ── LOGS TAB ── */}
        {activeTab === "logs" && (
          <div className="card" style={{ padding: 22 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, color: GREEN, fontSize: 15 }}>📋 Log ทั้งหมด</h3>
              <button className="btn-g" onClick={loadLogs} disabled={loading}>{loading ? "กำลังโหลด..." : "🔄 รีเฟรช"}</button>
            </div>
            {logs.length === 0 ? (
              <div style={{ textAlign: "center", color: "#9CA3AF", padding: "30px 0", fontSize: 13 }}>
                {loading ? "กำลังโหลด..." : "ไม่พบ Log — กด รีเฟรช"}
              </div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th>วันที่</th>
                      <th>ชื่อ</th>
                      <th>กลุ่ม</th>
                      <th>กิจกรรม</th>
                      <th>เวลา</th>
                      <th>Cal</th>
                      <th>จัดการ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {logs.map((l, i) => (
                      <LogRow key={l.id||i} l={l} toggleVerified={toggleVerified} saveComment={saveComment} deleteLog={deleteLog} GREEN={GREEN} isCalAnomaly={isCalAnomaly} />
                    ))}
                  </tbody>
                </table>
                <div style={{ marginTop: 12, fontSize: 12, color: "#9CA3AF" }}>รวม {logs.length} Logs · {logs.reduce((s, l) => s + (l.calories || 0), 0).toLocaleString()} kcal</div>
              </div>
            )}
          </div>
        )}



        {/* ── ANOMALY TAB ── */}
        {activeTab === "anomaly" && (() => {
          const anomalies = logs.filter(l => isCalAnomaly(l.exercise, l.duration, l.calories));
          return (
            <div className="card" style={{ padding: 22 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
                <div>
                  <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, color: "#D97706", fontSize: 15 }}>🔍 Log ที่มีแคลผิดปกติ</h3>
                  <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 3 }}>แคลที่บันทึก &gt; ค่าสูงสุดมาตรฐาน × 1.5</div>

                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  {anomalies.length > 0 && (
                    <span style={{ background: "#FEF3C7", color: "#D97706", borderRadius: 20, padding: "3px 12px", fontSize: 12, fontWeight: 700 }}>
                      ⚠️ {anomalies.length} รายการ
                    </span>
                  )}

              {loading ? (

                <div style={{ textAlign: "center", padding: "40px 0" }}>

              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {anomalies.map((l, i) => {
                    const range = calcCalRange(l.exercise, l.duration);

                      <div key={i} style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 12, padding: "14px 16px", display: "flex", gap: 12, alignItems: "flex-start" }}>
                        {l.photo && (
                          <img src={l.photo} alt="" style={{ width: 56, height: 56, borderRadius: 8, objectFit: "cover", flexShrink: 0 }} />
                        )}
                        {!l.photo && (
                          <div style={{ width: 56, height: 56, borderRadius: 8, background: "#FEF3C7", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 }}>📷</div>
                        )}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 4 }}>
                            <div>
                              <span style={{ fontWeight: 700, fontSize: 14 }}>{l.user}</span>
                              <span style={{ color: "#6B7280", fontSize: 12, marginLeft: 8 }}>{l.group}</span>
                            </div>
                            <span style={{ background: "#FEE2E2", color: "#DC2626", borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 700 }}>
                              +{overPct}% เกินมาตรฐาน
                            </span>
                          </div>
                          <div style={{ fontSize: 13, marginTop: 6 }}>
                            <span style={{ marginRight: 10 }}>{l.exercise} · {l.duration} นาที</span>
                            <span style={{ color: "#D97706", fontWeight: 700 }}>{l.calories.toLocaleString()} kcal 👀</span>
                            {range && (
                              <span style={{ color: "#9CA3AF", fontSize: 11, marginLeft: 8 }}>
                                (มาตรฐาน {range.min.toLocaleString()}–{range.max.toLocaleString()} kcal)
                              </span>
                            )}
                          </div>
                          <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4 }}>
                            {l.date} · {l.createdAt ? new Date(l.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : ''}
                          </div>
                          {l.note && <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4, fontStyle: "italic" }}>"{l.note}"</div>}
                          {/* Admin comment */}
                          {!l.verified && <CommentBox id={l.id} initial={l.adminComment} onSave={(txt)=>saveComment(l.id,txt)} />}
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
                          <button onClick={() => toggleVerified(l.id, l.verified)} title={l.verified?"ยกเลิก":"ตรวจสอบแล้ว"}
                            style={{ background: l.verified?"#DCFCE7":"#F3F4F6", border: l.verified?"1.5px solid #22C55E":"1.5px solid #D1D5DB", borderRadius:8, width:32, height:32, cursor:"pointer", fontSize:16, display:"flex", alignItems:"center", justifyContent:"center" }}>
                            {l.verified ? "\u2705" : "\u2b1c"}
                          </button>
                          <button className="btn-r" onClick={() => deleteLog(l.id)} style={{ fontSize: 12 }}>🗑</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}

        {/* ── EDIT USER MODAL ── */}
        {editUser && (
          <div onClick={e => e.target === e.currentTarget && closeEdit()}
            style={{ position:"fixed", inset:0, background:"#00000060", zIndex:500, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
            <div className="card" style={{ width:"100%", maxWidth:420, padding:28, position:"relative" }}>
              <button onClick={closeEdit}
                style={{ position:"absolute", top:14, right:16, background:"none", border:"none", cursor:"pointer", fontSize:20, color:"#9CA3AF", lineHeight:1 }}>✕</button>
              <h3 style={{ fontFamily:"'Prompt'", fontWeight:700, color:GREEN, fontSize:15, marginBottom:4 }}>✏️ แก้ไขข้อมูล User</h3>
              <div style={{ fontSize:12, color:"#9CA3AF", marginBottom:18 }}>รหัสพนักงาน: <strong>{editUser.EmployeeID}</strong></div>

              <label>ชื่อ-นามสกุล</label>
              <input className="inp" style={{ marginBottom:6 }}
                value={editForm.displayName}
                onChange={e => setEditForm(p => ({ ...p, displayName: e.target.value }))} />
              <div style={{ fontSize:11, color:"#D97706", marginBottom:14 }}>
                ⚠️ การเปลี่ยนชื่อจะอัปเดต Log กิจกรรมทั้งหมดของ user นี้ด้วยอัตโนมัติ
              </div>

              <label>รหัสผ่านใหม่ <span style={{ color:"#9CA3AF", fontWeight:400 }}>(เว้นว่างถ้าไม่เปลี่ยน)</span></label>
              <input className="inp" style={{ marginBottom:12 }} type="password" placeholder="••••••••"
                value={editForm.newPassword}
                onChange={e => setEditForm(p => ({ ...p, newPassword: e.target.value }))} />

              {editForm.newPassword && (
                <>
                  <label>ยืนยันรหัสผ่านใหม่</label>
                  <input className="inp" style={{ marginBottom:12 }} type="password" placeholder="••••••••"
                    value={editForm.confirmPassword}
                    onChange={e => setEditForm(p => ({ ...p, confirmPassword: e.target.value }))} />
                </>
              )}

              {editErr && (
                <div style={{ color:"#DC2626", fontSize:12, marginBottom:12, background:"#FEF2F2", padding:"8px 12px", borderRadius:8 }}>{editErr}</div>
              )}

              <div style={{ display:"flex", gap:10 }}>
                <button className="btn-g" style={{ flex:1, padding:11 }} onClick={handleEditSave} disabled={editLoading}>
                  {editLoading ? "⏳ กำลังบันทึก..." : "💾 บันทึก"}
                </button>
                <button onClick={closeEdit}
                  style={{ padding:"11px 20px", background:"#F3F4F6", border:"1px solid #D1D5DB", borderRadius:10, cursor:"pointer", fontFamily:"'Sarabun'", fontSize:13 }}>
                  ยกเลิก
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── STATS TAB ── */}
        {activeTab === "stats" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 16 }}>
            {[
              { icon: "👥", label: "Users ทั้งหมด", value: users.length || "-", color: GREEN },
              { icon: "📋", label: "Logs ทั้งหมด", value: logs.length || "-", color: "#4ADE80" },
              { icon: "🔥", label: "Cal สะสมรวม", value: logs.reduce((s, l) => s + (l.calories || 0), 0).toLocaleString() || "-", color: GREEN },
              { icon: "🏃", label: "นาทีรวม", value: logs.reduce((s, l) => s + (l.duration || 0), 0).toLocaleString() || "-", color: "#059669" },
            ].map(s => (
              <div key={s.label} className="card" style={{ padding: 22, textAlign: "center" }}>
                <div style={{ fontSize: 32, marginBottom: 8 }}>{s.icon}</div>
                <div style={{ fontFamily: "'Prompt'", fontSize: 28, fontWeight: 900, color: s.color }}>{s.value}</div>
                <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 4 }}>{s.label}</div>
              </div>
            ))}
            <div className="card" style={{ padding: 16, gridColumn: "1/-1" }}>
              <h4 style={{ fontFamily: "'Prompt'", fontWeight: 700, color: GREEN, marginBottom: 12, fontSize: 14 }}>📊 Cal ตามกลุ่ม</h4>
              {Object.entries(logs.reduce((acc, l) => { acc[l.group] = (acc[l.group] || 0) + (l.calories || 0); return acc; }, {}))
                .sort((a, b) => b[1] - a[1])
                .map(([group, cal], i) => (
                  <div key={group} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={{ fontSize: 12, color: "#6B7280", width: 60 }}>{group}</span>
                    <div style={{ flex: 1, background: "#F3F4F6", borderRadius: 6, height: 18, overflow: "hidden" }}>
                      <div style={{ height: "100%", background: `linear-gradient(90deg,${GREEN},#4ADE80)`, width: `${Math.round(cal / Math.max(...Object.values(logs.reduce((acc, l) => { acc[l.group] = (acc[l.group] || 0) + (l.calories || 0); return acc; }, {}))) * 100)}%`, borderRadius: 6, transition: "width .5s" }} />
                    </div>
                    <span style={{ fontSize: 12, color: GREEN, fontWeight: 700, width: 70, textAlign: "right" }}>{cal.toLocaleString()} kcal</span>
                  </div>
              ))}
              {logs.length === 0 && <div style={{ color: "#9CA3AF", fontSize: 12 }}>ยังไม่มีข้อมูล — ไปที่แท็บ Logs แล้วกด รีเฟรช</div>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
</script>
</body>
</html>
