const lsGet = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(_e) { return fallback; } };
const lsSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(_e) {} };

// บีบอัดรูปให้ไม่เกิน 100KB — ลด quality ซ้ำจนถึงขนาดที่กำหนด
const resizeImage = (file, maxPx = 500, maxBytes = 100000) => new Promise(resolve => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(blobUrl);
    // ลด quality ซ้ำจนขนาด base64 ไม่เกิน maxBytes
    let q = 0.8;
    let b64 = c.toDataURL("image/jpeg", q);
    while (b64.length * 0.75 > maxBytes && q > 0.1) {
      q = Math.max(0.1, q - 0.1);
      b64 = c.toDataURL("image/jpeg", q);
    }
    resolve(b64);
  };
  img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(null); };
  img.src = blobUrl;
});

// --- เพิ่มฟังก์ชันแปลง Base64 และอัปโหลดไปยัง Storage ตรงนี้ ---
  const base64ToBlob = (base64Str) => {
    const parts = base64Str.split(';base64,');
    const contentType = parts[0].split(':')[1];
    const raw = window.atob(parts[1]);
    const rawLength = raw.length;
    const uInt8Array = new Uint8Array(rawLength);
    for (let i = 0; i < rawLength; ++i) {
      uInt8Array[i] = raw.charCodeAt(i);
    }
    return new Blob([uInt8Array], { type: contentType });
  };

  const uploadImageToStorage = async (base64Str, folder = 'logs') => {
    if (!base64Str) return null;
    try {
      const blob = base64ToBlob(base64Str);
      // เปลี่ยนจากโครงสร้าง folder/ ให้เป็นชื่อไฟล์แบนๆ ตรงๆ เพื่อให้เซฟลง Bucket ได้ชัวร์ๆ
      const fileName = `${folder}-${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;
      
      const { data, error } = await supabase.storage
        .from('exercise-photos')
        .upload(fileName, blob, {
          contentType: 'image/jpeg',
          upsert: true
        });

      if (error) throw error;

      const { data: { publicUrl } } = supabase.storage
        .from('exercise-photos')
        .getPublicUrl(fileName);

      return publicUrl;
    } catch (err) {
      console.error("Storage Upload Error:", err.message);
      return null;
    }
  };

    const d = new Date("2026-03-29");
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().split("T")[0];
    const cal = userLogs.filter(l => l.date === ds).reduce((s, l) => s + l.calories, 0);
    days.push({ date: ds, cal, label: ["อา","จ","อ","พ","พฤ","ศ","ส"][d.getDay()] });
  }
  return days;
};

                      <div style={{ display: "flex", gap: 5 }}>
                        <button className="btn-g" onClick={() => handleEditGrp(g)} style={{ padding: "4px 9px", fontSize: 11 }}>✏️</button>
                        <button className="btn-r" onClick={() => setDeleteConfirm({ name: g.name, fn: () => { setGroups(p => p.filter(x => x.id !== g.id)); setDeleteConfirm(null); } })} style={{ padding: "4px 9px", fontSize: 11 }}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {adminSection === "goals" && (
              <div>
                <div className="adm-card" style={{ padding: 17, marginBottom: 14 }}>
                  <div style={{ fontFamily: "'Prompt'", fontWeight: 700, color: "#6EE7B7", marginBottom: 12, fontSize: 13 }}>🎯 ตั้งเป้าหมายแคลอรี่รายสัปดาห์</div>
                  <div style={{ marginBottom: 11 }}>
                    <label style={{ fontSize: 10, color: "#6B7280", display: "block", marginBottom: 5 }}>เลือกพนักงาน</label>
                    <select value={goalFormUser} onChange={e => { setGoalFormUser(e.target.value); setGoalFormVal(goals[e.target.value]?.weekly || 5000); }} style={{ width: "100%", padding: "10px 11px", borderRadius: 9, fontSize: 13 }}>
                      <option value="">-- เลือก --</option>
                      {userStats.map(u => <option key={u.user} value={u.user}>{u.user} ({u.group})</option>)}
                    </select>
                  </div>
                  <div style={{ marginBottom: 13 }}>
                    <label style={{ fontSize: 10, color: "#6B7280", display: "block", marginBottom: 5 }}>เป้าหมาย: <span style={{ color: "#16A34A" }}>{goalFormVal.toLocaleString()} kcal/สัปดาห์</span></label>
                    <input type="range" min={500} max={10000} step={250} value={goalFormVal} onChange={e => setGoalFormVal(+e.target.value)} style={{ width: "100%", accentColor: "#16A34A" }} />
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#9CA3AF", marginTop: 3 }}><span>500</span><span>10,000</span></div>
                  </div>
                  <button className="btn-p" onClick={handleSaveGoal} disabled={!goalFormUser} style={{ width: "100%", padding: 11, fontSize: 13, opacity: goalFormUser ? 1 : 0.4 }}>💾 บันทึกเป้าหมาย</button>
                </div>

                <div style={{ fontSize: 11, color: "#9CA3AF", marginBottom: 9 }}>เป้าหมายที่ตั้งไว้</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {userStats.map(u => {
                    const g = goals[u.user];
                    const color = getGroupColor(u.group);
                    const weeklyTotal7 = getLast7Days(logs.filter(l => l.user === u.user)).reduce((s, d) => s + d.cal, 0);
                    return (
                      <div key={u.user} className="card" style={{ padding: "12px 15px" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: g ? 8 : 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                            <div style={{ width: 32, height: 32, borderRadius: 8, background: color + "22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>👤</div>
                            <div>
                              <div style={{ fontWeight: 700, fontSize: 13 }}>{u.user}</div>
                              <div style={{ fontSize: 10, color: "#9CA3AF" }}>{u.group}</div>
                            </div>
                          </div>
                          <div style={{ textAlign: "right" }}>
                            {g ? <div style={{ fontFamily: "'Prompt'", fontWeight: 700, fontSize: 13, color: "#6EE7B7" }}>{g.weekly.toLocaleString()} kcal/wk</div> : <div style={{ fontSize: 11, color: "#374151" }}>ยังไม่ตั้งเป้า</div>}
                          </div>
                        </div>
                        {g && (
                          <div>
                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#9CA3AF", marginBottom: 3 }}>
                              <span>สัปดาห์นี้: {weeklyTotal7.toLocaleString()} kcal</span>
                              <span style={{ color: weeklyTotal7 >= g.weekly ? "#10B981" : "#16A34A" }}>{Math.min(100, Math.round((weeklyTotal7 / g.weekly) * 100))}%</span>
                            </div>
                            <div className="goal-bar-bg">
                              <div className="goal-bar-fill" style={{ width: `${Math.min(100, (weeklyTotal7 / g.weekly) * 100)}%`, background: weeklyTotal7 >= g.weekly ? "linear-gradient(90deg,#7EE787aa,#7EE787)" : `linear-gradient(90deg,${color}55,${color})` }} />
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {adminSection === "logs" && (
              <div>
                <div style={{ background: spStatus === "connected" ? "linear-gradient(135deg,#0a1a0a,#0d1f0d)" : spStatus === "error" ? "linear-gradient(135deg,#1a0a0a,#1f0d0d)" : "linear-gradient(135deg,#FFFFFF,#F8F9FF)", border: `1px solid ${spStatus === "connected" ? "#7EE78728" : spStatus === "error" ? "#e74c3c22" : "#E5E7EB"}`, borderRadius: 11, padding: "10px 13px", marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 16 }}>{spStatus === "connected" ? "🟢" : spStatus === "connecting" ? "🟡" : spStatus === "error" ? "🔴" : "⚪"}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: spStatus === "connected" ? "#10B981" : spStatus === "error" ? "#e74c3c" : "#6B7280" }}>
                      {spStatus === "connected" ? `Supabase เชื่อมต่อแล้ว · sync ${spLastSync}` : spStatus === "connecting" ? "กำลังเชื่อมต่อ Supabase..." : spStatus === "error" ? "Supabase เชื่อมต่อไม่ได้ · ใช้ Local Storage" : "กำลังเชื่อมต่อ Supabase..."}
                    </div>
                    <div style={{ fontSize: 10, color: "#9CA3AF" }}>ข้อมูลถูกเก็บในเครื่องอัตโนมัติ ไม่หายเมื่อรีเฟรช</div>
                  </div>
                  {(
                    <button className="btn-teal" style={{ padding: "5px 11px", fontSize: 11, flexShrink: 0 }}
                      onClick={() => { setSpStatus("connecting"); sbFetchLogs().then(d => { if (d.length > 0) setLogs(d); setSpStatus("connected"); setSpLastSync(new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })); }).catch(() => setSpStatus("error")); }}>
                      🔄 Sync
                    </button>
                  )}
                </div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 9 }}>
                  <div style={{ fontSize: 11, color: "#9CA3AF" }}>{logs.length} รายการ</div>
                  <div style={{ display: "flex", gap: 7 }}>
                    <button className="btn-teal" onClick={exportCSV} style={{ padding: "5px 11px", fontSize: 11 }}>⬇️ CSV</button>
                    <button className="btn-r" onClick={() => setDeleteConfirm({ name: "ประวัติทั้งหมด", fn: () => { setLogs([]); setDeleteConfirm(null); } })} style={{ padding: "5px 11px", fontSize: 11 }}>🗑️ ล้าง</button>
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {logs.map(log => {
                    const c = getGroupColor(log.group);
                    return (
                      <div key={log.id} style={{ background: "#FFFFFF", border: "1px solid #F3F4F6", borderRadius: 9, padding: "8px 12px", display: "flex", alignItems: "center", gap: 8 }}>
                        {log.photo && <div className="pthumb" onClick={() => setZoomPhoto(log.photo)} style={{ width: 34, height: 34, flexShrink: 0 }}><img src={log.photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /></div>}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 1 }}>
                            <span onClick={() => { setProfileUser(log.user); setProfileFilter("all"); setActiveTab("profile"); }} style={{ fontWeight: 700, fontSize: 12, cursor: "pointer", textDecoration: "underline dotted" }}>{log.user}</span>
                            <span style={{ fontSize: 9, background: c + "22", color: c, borderRadius: 4, padding: "1px 5px" }}>{log.group}</span>
                          </div>
                          <div style={{ color: "#9CA3AF", fontSize: 10 }}>{log.exercise} · {log.duration}น. · {log.date} · ❤️{log.likes}</div>
                        </div>
                        <div style={{ fontFamily: "'Prompt'", fontWeight: 700, fontSize: 12, color: "#16A34A", flexShrink: 0 }}>{log.calories}</div>
                        <button className="dx" onClick={() => {
                          if (log.spId) sbRemoveLog(log.spId).catch(() => {});
                          setLogs(p => p.filter(l => l.id !== log.id));
                        }}>✕</button>
                      </div>
                    );
                  })}
                  {logs.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#374151", fontSize: 14 }}>ยังไม่มีข้อมูล</div>}
                </div>
              </div>
            )}
          </div>
        )}

      </div>

      {/* ── EDIT PROFILE MODAL ── */}
      {showEditProfile && (
        <div style={{ position: "fixed", inset: 0, background: "#00000060", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setShowEditProfile(false)}>
          <div style={{ background: "#fff", borderRadius: 20, padding: "24px 20px", width: "100%", maxWidth: 360, boxShadow: "0 20px 60px #00000030" }} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontFamily: "'Prompt'", fontWeight: 700, fontSize: 16, marginBottom: 20, color: "#1F2937" }}>✏️ แก้ไขโปรไฟล์</h3>
            {/* Avatar Upload */}
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div onClick={() => avatarEditRef.current?.click()} style={{ width: 90, height: 90, borderRadius: "50%", border: "2.5px dashed #22C55E", display: "inline-flex", alignItems: "center", justifyContent: "center", cursor: "pointer", overflow: "hidden", background: "#F0FDF4" }}>
                {(editForm.avatar !== undefined ? editForm.avatar : authUser?.avatar)
                  ? <img src={editForm.avatar !== undefined ? editForm.avatar : authUser.avatar} style={{ width: "100%", height: "100%", objectFit: "cover" }} alt="avatar" />
                  : <span style={{ fontSize: 36 }}>📷</span>}
              </div>
              <input ref={avatarEditRef} type="file" accept="image/*" style={{ display: "none" }} onChange={e => { const f = e.target.files?.[0]; if (!f) return; resizeImage(f).then(b64 => setEditForm(p => ({ ...p, avatar: b64 }))); }} />
              <div style={{ fontSize: 10, color: "#9CA3AF", marginTop: 5 }}>แตะวงกลมเพื่อเปลี่ยนรูป</div>
              {(editForm.avatar !== undefined && editForm.avatar !== null) && (
                <button onClick={() => setEditForm(p => ({ ...p, avatar: null }))} style={{ marginTop: 6, background: "none", border: "none", color: "#9CA3AF", fontSize: 11, cursor: "pointer", textDecoration: "underline" }}>ลบรูปภาพ</button>
              )}
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
              <button onClick={() => setShowEditProfile(false)} style={{ flex: 1, padding: "11px", borderRadius: 12, border: "1.5px solid #E5E7EB", background: "#fff", cursor: "pointer", fontFamily: "'Prompt'", fontSize: 13, color: "#6B7280" }}>ยกเลิก</button>
              <button onClick={handleSaveProfile} style={{ flex: 2, padding: "11px", borderRadius: 12, border: "none", background: "linear-gradient(135deg,#16A34A,#22C55E)", color: "#fff", cursor: "pointer", fontFamily: "'Prompt'", fontWeight: 700, fontSize: 13 }}>บันทึก</button>
            </div>
          </div>
        </div>
      )}

      {/* Bottom Tab Nav */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 10, background: "#FFFFFF", paddingBottom: "env(safe-area-inset-bottom,0px)", borderTop: "1px solid #F3F4F6", padding: "8px 10px 12px" }}>
        <div className="tab-nav" style={{ maxWidth: 680, margin: "0 auto" }}>
          {tabs.map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`tb ${activeTab === tab.id ? "tb-on" : ""}`}>
              <span style={{ fontSize: 15 }}>{tab.icon}</span>
              <span>{tab.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CalorieTracker />);
  </script>
</body>
</html>
